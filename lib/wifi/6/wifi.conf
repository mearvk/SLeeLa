# SLeeLa Wi-Fi 6 static reference profile
# 6 GHz is deliberately not enabled by this generic Wi-Fi 6 profile.
profile_name=wifi6-802.11ax
standard=IEEE 802.11ax
bands_ghz=2.4,5
wifi6e_6ghz=explicit_extension_only
channel_widths_mhz=20,40,80,160
maximum_spatial_streams=8
maximum_qam_order=1024
theoretical_peak_phy_mbps=9600
features=ofdma;uplink_downlink_mu_mimo;bss_coloring;target_wake_time
runtime_capability_discovery=required
regulatory_domain=runtime
channel_plan=runtime
security_policy=prefer_wpa3;allow_wpa2_aes_ccmp_if_needed;deny_wep;deny_tkip
radio_control=operating_system_or_driver
