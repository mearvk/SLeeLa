name: GUI Bridge CI

on:
  push:
    paths:
      - 'gui/**'
      - 'lib/gui/**'
      - 'lib/gui/version-mual/**'
      - 'lib/gui/version-gual/**'
      - 'lib/gui/version-thual/**'
      - 'lib/gui/version-dual/**'
      - '.github/workflows/gui-ci.yml'
  pull_request:
    paths:
      - 'gui/**'
      - 'lib/gui/**'
      - 'lib/gui/version-mual/**'
      - 'lib/gui/version-gual/**'
      - 'lib/gui/version-thual/**'
      - 'lib/gui/version-dual/**'
      - '.github/workflows/gui-ci.yml'

jobs:
  build-gui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and test the native GUI bridge (Path 3 ABI)
        working-directory: gui/native
        run: make clean all test

      - name: Validate the SLeeLa gui source layer (version-mual / version-gual)
        run: |
          set -eu
          # The GUI SLeeLa impl now lives in lib/gui/version-mual/ (moved from lib/gui/),
          # with an identical copy in lib/gui/version-gual/. lib/gui/ keeps the docs.
          # Integration layer: 9 Master Classes + SLPackage + gui-demo (11).
          # Event/DHTML/scripting layer: SLGuiEventType, SLGuiEvent,
          # SLGuiHandler, SLGuiEventBus, SLGuiNode, SLGuiDom,
          # SLGuiScriptCommand, SLGuiScript + gui-events-demo (9).
          # Support structure (DOM<->toolkit wiring): SLGuiWidgetFactory,
          # SLGuiMount, SLGuiHostAdapter, SLGuiApp + gui-app-demo (5). Baseline 25.
          # mual (1.0): 25-file baseline. gual (2.0): +SLGuiSettings (26).
          # thual (3.0): gual + 5 effects units (SLGuiEffects, SLGuiRotationSchedule,
          # SLGuiBranding, SLGuiAudioCues, gui-effects-demo) = 31.
          test "$(find lib/gui/version-mual -maxdepth 1 -name '*.sleela' | wc -l)" -eq 25
          test "$(find lib/gui/version-gual -maxdepth 1 -name '*.sleela' | wc -l)" -eq 26
          test "$(find lib/gui/version-thual -maxdepth 1 -name '*.sleela' | wc -l)" -eq 31
          # dual (4.0): thual + component units (recorder, video, urlbar, click
          # object, layout, graphics, admin authority, components demo) + the
          # HTML renderer / codec registry / html-codecs demo = 42.
          test "$(find lib/gui/version-dual -maxdepth 1 -name '*.sleela' | wc -l)" -eq 42
          for c in SLGuiCodecs SLGuiHtmlRenderer; do
            test -f "lib/gui/version-dual/$c.sleela"
          done
          test -f lib/gui/version-gual/SLGuiSettings.sleela
          test -f lib/gui/version-thual/SLGuiSettings.sleela
          for c in SLGuiEffects SLGuiRotationSchedule SLGuiBranding SLGuiAudioCues; do
            test -f "lib/gui/version-thual/$c.sleela"
          done
          test -f lib/gui/version-thual/gui-effects-demo.sleela
          for c in SLGuiAudioRecorder SLGuiVideoCanvas SLGuiUrlBar SLGuiClickObject \
                   SLGuiLayout SLGuiGraphics SLGuiAdminAuthority; do
            test -f "lib/gui/version-dual/$c.sleela"
          done
          test -f lib/gui/version-dual/gui-components-demo.sleela
          for d in lib/gui/version-mual lib/gui/version-gual lib/gui/version-thual lib/gui/version-dual; do
            test -f "$d/SLPackage.sleela"
            test -f "$d/gui-demo.sleela"
            test -f "$d/gui-events-demo.sleela"
            test -f "$d/gui-app-demo.sleela"
            # Event + DHTML + scripting classes are present.
            for c in SLGuiEventType SLGuiEvent SLGuiHandler SLGuiEventBus \
                     SLGuiNode SLGuiDom SLGuiScriptCommand SLGuiScript; do
              test -f "$d/$c.sleela"
            done
            # DOM<->toolkit support-structure classes are present.
            for c in SLGuiWidgetFactory SLGuiMount SLGuiHostAdapter SLGuiApp; do
              test -f "$d/$c.sleela"
            done
            for f in "$d"/*.sleela; do
              grep -q '^#sleela 2.1$' "$f"
              grep -q '^class ' "$f"
            done
          done

      - name: Compile the native GUI bridge standalone (ABI sanity)
        run: |
          set -eu
          mkdir -p /tmp/sleela-gui-ci
          g++ -std=c++17 -Wall -Wextra -Wpedantic -Werror \
            -c gui/native/sleela_gui_bridge.cpp \
            -o /tmp/sleela-gui-ci/sleela_gui_bridge.o
