# SLeeLa configuration location policy
config.project.name = SLeeLa
config.location.relative = config
config.location.absolute = /etc/sleela
config.location.install_relative = Config
# Environment: SLEELA_PROJECT_NAME, SLEELA_PROJECT_ROOT,
# SLEELA_INSTALL_ROOT, SLEELA_CONFIG_ROOT
# Precedence: explicit absolute / SLEELA_CONFIG_ROOT,
# project-root + relative, install-root + install-relative, absolute.
