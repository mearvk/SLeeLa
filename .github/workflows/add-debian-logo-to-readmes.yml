name: Add Debian logo to README files

on:
  push:
    branches:
      - master
      - main

permissions:
  contents: write

jobs:
  update-readmes:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add Debian logo where needed
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          logo = "[![SLeeLa](https://github.com/mearvk/SLeeLa/blob/master/images/debian-logo.png)](https://github.com/mearvk/SLeeLa)\n"

          changed = 0
          for path in Path(".").rglob("README.md"):
              if ".git" in path.parts:
                  continue
              text = path.read_text(encoding="utf-8")
              top = "\n".join(text.splitlines()[:15])
              if re.search(r"!\\[[^\\]]*\\]\\([^)]+\\)|<img\\b[^>]*>|<picture\\b[^>]*>", top, re.IGNORECASE):
                  continue
              path.write_text(logo + text, encoding="utf-8")
              changed += 1

          print(f"README files updated: {changed}")
          PY

      - name: Remove one-shot workflow
        run: rm -f .github/workflows/add-debian-logo-to-readmes.yml

      - name: Commit README updates
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "SLeeLa Automation"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md '**/README.md' .github/workflows/add-debian-logo-to-readmes.yml
          if git diff --cached --quiet; then
            echo "No README changes required."
            exit 0
          fi
          git commit -m "docs: add Debian logo to README files"
          git push
