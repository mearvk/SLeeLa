name: Native C and C++ Portability

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  posix:
    name: Native runtime (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build and test philosophy event tree
        run: make -C philosophy clean all test

      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config python3 openjdk-21-jdk libx11-dev libfreetype-dev libfontconfig1-dev

      - name: Set up Java on macOS
        if: runner.os == 'macOS'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build native runtime and static core
        env:
          SLEELA_SHA256_MANIFEST: ${{ github.workspace }}/security/sha256-manifest.json
        run: make -C impl clean all

      - name: Test native Wi-Fi manager contract
        timeout-minutes: 3
        run: make -C wifi-common test

      - name: Smoke test threading backend
        timeout-minutes: 3
        env:
          SLEELA_SHA256_MANIFEST: ${{ github.workspace }}/security/sha256-manifest.json
        run: make -C impl test-thread-platform

      - name: Smoke test networking backend
        timeout-minutes: 3
        env:
          SLEELA_SHA256_MANIFEST: ${{ github.workspace }}/security/sha256-manifest.json
        run: make -C impl test-network-platform

      - name: Smoke test file I/O backend
        timeout-minutes: 3
        env:
          SLEELA_SHA256_MANIFEST: ${{ github.workspace }}/security/sha256-manifest.json
        run: make -C impl test-io-platform

      - name: Smoke test paths backend
        timeout-minutes: 3
        env:
          SLEELA_SHA256_MANIFEST: ${{ github.workspace }}/security/sha256-manifest.json
        run: make -C impl test-path-platform

      - name: Smoke test terminal backend
        timeout-minutes: 3
        env:
          SLEELA_SHA256_MANIFEST: ${{ github.workspace }}/security/sha256-manifest.json
        run: make -C impl test-terminal-platform

      - name: Smoke test native library loading
        timeout-minutes: 3
        env:
          SLEELA_SHA256_MANIFEST: ${{ github.workspace }}/security/sha256-manifest.json
        run: make -C impl test-library-platform

      - name: Smoke test precision time backend
        timeout-minutes: 3
        env:
          SLEELA_SHA256_MANIFEST: ${{ github.workspace }}/security/sha256-manifest.json
        run: make -C impl test-time-platform

      - name: Smoke test core threading
        timeout-minutes: 3
        env:
          SLEELA_SHA256_MANIFEST: ${{ github.workspace }}/security/sha256-manifest.json
        run: make -C impl test-threads

      - name: Smoke test core networking
        timeout-minutes: 3
        env:
          SLEELA_SHA256_MANIFEST: ${{ github.workspace }}/security/sha256-manifest.json
        run: make -C impl test-network

  windows:
    name: Native runtime (Windows 10+ / MinGW-w64)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Set up MSYS2 UCRT64
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            make
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-python

      - name: Check out source
        uses: actions/checkout@v4

      - name: Build native runtime and static core
        env:
          SLEELA_SHA256_MANIFEST: ${{ github.workspace }}/security/sha256-manifest.json
        run: make -C impl clean all

      - name: Test native Wi-Fi manager contract
        timeout-minutes: 3
        run: make -C wifi-common test

      - name: Smoke test threading backend
        timeout-minutes: 3
        env:
          SLEELA_SHA256_MANIFEST: ${{ github.workspace }}/security/sha256-manifest.json
        run: make -C impl test-thread-platform

      - name: Smoke test networking backend
        timeout-minutes: 3
        env:
          SLEELA_SHA256_MANIFEST: ${{ github.workspace }}/security/sha256-manifest.json
        run: make -C impl test-network-platform

      - name: Smoke test file I/O backend
        timeout-minutes: 3
        env:
          SLEELA_SHA256_MANIFEST: ${{ github.workspace }}/security/sha256-manifest.json
        run: make -C impl test-io-platform

      - name: Smoke test paths backend
        timeout-minutes: 3
        env:
          SLEELA_SHA256_MANIFEST: ${{ github.workspace }}/security/sha256-manifest.json
        run: make -C impl test-path-platform

      - name: Smoke test native library loading
        timeout-minutes: 3
        env:
          SLEELA_SHA256_MANIFEST: ${{ github.workspace }}/security/sha256-manifest.json
        run: make -C impl test-library-platform

      - name: Smoke test precision time backend
        timeout-minutes: 3
        env:
          SLEELA_SHA256_MANIFEST: ${{ github.workspace }}/security/sha256-manifest.json
        run: make -C impl test-time-platform

      - name: Smoke test core threading
        timeout-minutes: 3
        env:
          SLEELA_SHA256_MANIFEST: ${{ github.workspace }}/security/sha256-manifest.json
        run: make -C impl test-threads

      - name: Smoke test core networking
        timeout-minutes: 3
        env:
          SLEELA_SHA256_MANIFEST: ${{ github.workspace }}/security/sha256-manifest.json
        run: make -C impl test-network
