[audio-mix]
version=1
project=synchronized-audio-mix
timeline.unit=ns
timeline.start=0
timeline.sample_rate=48000

[input.master]
role=master
type=file
path=audio/master.wav
load_at_ns=0
start_at_ns=0
quality=1.0
gain_db=0

[input.second]
role=second
type=file
path=audio/second.flac
load_at_ns=0
start_at_ns=125000000
quality=0.92
gain_db=-3

[input.live]
role=input
type=live
device=default
load_at_ns=0
start_at_ns=500000000
quality=1.0
gain_db=-6

[relative_quality]
mode=linear
reference=master
min=0.0
max=1.0

[mixer]
bass_db=3
mid_db=-1
treble_db=2
gain_db=0
pan=0

[channel.1]
gain=1.0

[channel.2]
gain=1.0

[synchronization]
mode=timeline
preserve_track_offsets=true
process_as_arriving=true
write_output_while_processing=true
output=audio/mix-output.wav
