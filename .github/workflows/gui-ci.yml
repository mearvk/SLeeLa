name: GUI Bridge CI

on:
  push:
    paths:
      - 'gui/**'
      - 'lib/gui/**'
      - '.github/workflows/gui-ci.yml'
  pull_request:
    paths:
      - 'gui/**'
      - 'lib/gui/**'
      - '.github/workflows/gui-ci.yml'

jobs:
  build-gui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and test the native GUI bridge (Path 3 ABI)
        working-directory: gui/native
        run: make clean all test

      - name: Validate the SLeeLa gui source layer (lib/gui)
        run: |
          set -eu
          # Integration layer: 9 Master Classes + SLPackage + gui-demo (11).
          # Event/DHTML/scripting layer: SLGuiEventType, SLGuiEvent,
          # SLGuiHandler, SLGuiEventBus, SLGuiNode, SLGuiDom,
          # SLGuiScriptCommand, SLGuiScript + gui-events-demo (9).
          # Support structure (DOM<->toolkit wiring): SLGuiWidgetFactory,
          # SLGuiMount, SLGuiHostAdapter, SLGuiApp + gui-app-demo (5). Total 25.
          test "$(find lib/gui -maxdepth 1 -name '*.sleela' | wc -l)" -eq 25
          test -f lib/gui/SLPackage.sleela
          test -f lib/gui/gui-demo.sleela
          test -f lib/gui/gui-events-demo.sleela
          test -f lib/gui/gui-app-demo.sleela
          # Event + DHTML + scripting classes are present.
          for c in SLGuiEventType SLGuiEvent SLGuiHandler SLGuiEventBus \
                   SLGuiNode SLGuiDom SLGuiScriptCommand SLGuiScript; do
            test -f "lib/gui/$c.sleela"
          done
          # DOM<->toolkit support-structure classes are present.
          for c in SLGuiWidgetFactory SLGuiMount SLGuiHostAdapter SLGuiApp; do
            test -f "lib/gui/$c.sleela"
          done
          for f in lib/gui/*.sleela; do
            grep -q '^#sleela 1.3$' "$f"
            grep -q '^class ' "$f"
          done

      - name: Compile the native GUI bridge standalone (ABI sanity)
        run: |
          set -eu
          mkdir -p /tmp/sleela-gui-ci
          g++ -std=c++17 -Wall -Wextra -Wpedantic -Werror \
            -c gui/native/sleela_gui_bridge.cpp \
            -o /tmp/sleela-gui-ci/sleela_gui_bridge.o
