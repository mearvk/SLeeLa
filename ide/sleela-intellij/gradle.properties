group=com.mearvk.sleela
version=0.3.0-dev

# IntelliJ Platform target.
# Preferred: build against a locally installed IDE (no download, exact match).
# Point localIdePath at the IDE install ROOT (the dir containing bin/ lib/ plugins/).
localIdePath=/home/mearvk/Desktop/idea-2026.2.3/idea-IU-262.10968.63

# Fallback when localIdePath is empty: download this published IC build.
platformType=IC
platformVersion=2025.3.6.1

# Supported IDE build range for the published plugin.
# IntelliJ IDEA 2026.2.x = build 262. untilBuild is left open so patch updates
# of the same line do not disable the plugin.
pluginSinceBuild=262
pluginUntilBuild=

# Gradle / configuration cache
org.gradle.configuration-cache=true
org.gradle.caching=true
kotlin.stdlib.default.dependency=false
