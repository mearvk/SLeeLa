# http3_colors.conf -- SLeeLa HTTP 3.0 "colors" palette.
#
# Each line names one HTTP color and its configuration. A SLeeLa program names
# a color from source (see HTTP-COLORS.md) and gets this bundle of settings.
# This file is the authoritative palette; it is mirrored in http3_profile.c and
# http3_flow.py. Blank lines and lines starting with '#' are ignored.
#
# Columns (whitespace-separated):
#   name       color name (<= 23 chars)
#   wire       "text" | "binary"
#   flags      default envelope FLAGS bitfield (decimal)
#              1=BINARY 2=COMPRESSED 4=STREAM 8=IDEMPOTENT 16=RESET
#   mac        1 = keyed-MAC DIGEST required, 0 = not required
#   intactx    1 = apply INTACTX tamper gate, 0 = off
#   threshold  INTACTX variance threshold (decimal; 0 = library default)
#   replay     1 = apply NONCE replay guard, 0 = off
#   basket     1 = expect goods & services basket present, 0 = not required
#
# name    wire    flags  mac  intactx  threshold  replay  basket
green     text    0      0    0        0          0       0
amber     text    0      1    0        0          1       0
red       binary  1      1    1        0          1       1
black     binary  3      1    1        0          1       1
