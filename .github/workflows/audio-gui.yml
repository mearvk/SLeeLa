name: SLeeLa Audio GUI
on:
  push:
    paths: ['audio/gui/**', '.github/workflows/audio-gui.yml']
  pull_request:
    paths: ['audio/gui/**', '.github/workflows/audio-gui.yml']
  workflow_dispatch:
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: audio/gui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn --batch-mode --no-transfer-progress clean test
