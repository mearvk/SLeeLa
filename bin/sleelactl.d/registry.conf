# =============================================================================
# sleelactl module registry — the single source of truth for every module
# sleelactl controls. The dispatcher holds NO module-specific knowledge: unit
# names, directories, demos, binaries, scripts, handler counts and ordering all
# live here. Adding a module is a one-line append; validate it with
#
#     sleelactl check-registry --strict
#
# Format 2 (declared by the `format=2` line). One module per line; '#' starts a
# comment line; blank lines are ignored:
#
#     <name>  nature=<nature>  [key=value ...]  [summary="free text"]
#
# Values containing spaces must be double-quoted. All paths are relative to the
# SLeeLa root and may not be absolute or contain '..'.
#
# Keys per nature, whether each is required, and what it means are defined
# once in the script and printed by:
#
#     sleelactl keys            (or: keys --markdown, --json keys)
#
# Format 1 (legacy `<name> <nature> <handle> <summary>` lines, no format= line)
# is still read for older installs; check-registry reports it as legacy.
# =============================================================================
format=2

# ---- daemons: long-lived processes under the host service manager -----------
# Unit files declare no inter-daemon ordering (only local-fs/network targets),
# so no after= edges are registered.
server-edition   nature=daemon  unit=sleela-server.service     launchd=com.mearvk.sleela-server   summary="Bounded transport + packet-admission server (sleelas/serverd)"
server-edition3  nature=daemon  unit=sleela-server3.service    launchd=com.mearvk.sleela-server3  summary="Server edition, moral tier 3 (serverd)"
antivirus        nature=daemon  unit=sleela-antivirus.service  summary="Antivirus coordinator (sleelavirin scan engine)"

# ---- registries: closed handler sets owned by a process-local Controller ----
codecs       nature=registry  dir=lib/codecs       demo=lib/codecs/codec-pipeline.sleela             handlers=20  summary="Audio codec registry"
compression  nature=registry  dir=lib/compression  demo=lib/compression/compression-pipeline.sleela  handlers=15  summary="Compression registry (native 0-3)"
video        nature=registry  dir=lib/video        demo=lib/video/video-codec-pipeline.sleela        handlers=12  summary="Video codec registry"

# ---- data systems: open/close/active + connection pooling (SLDataSource) ----
database        nature=datasource  dir=lib/database      summary="SQL data sources + connection pool (open/close/active)"
db-connector    nature=datasource  dir=lib/db-connector  summary="Native database connector driver"
sleela-sql      nature=datasource  dir=lib/sleela-sql    summary="SLeeLa SQL dialect/engine"
ledger          nature=datasource  dir=lib/ledger        summary="Append-only ledger store"
registry-store  nature=datasource  dir=lib/registry      summary="Native object/subject registry store"

# ---- protocols: specs / stacks / reference models ---------------------------
http-1.0           nature=protocol  dir=http-1.0           summary="HTTP/1.0 protocol metadata generation"
http-2.0           nature=protocol  dir=http-2.0           summary="HTTP/2.0 protocol metadata generation"
http-3.0           nature=protocol  dir=http-3.0           summary="HTTP/3.0 protocol metadata generation"
http-4.0           nature=protocol  dir=http-4.0           summary="HTTP/4.0 protocol metadata generation"
http-5.0           nature=protocol  dir=http-5.0           summary="HTTP/5.0 protocol metadata generation"
http-6.0           nature=protocol  dir=http-6.0           summary="HTTP/6.0 protocol metadata generation"
http-7.0           nature=protocol  dir=http-7.0           summary="HTTP/7.0 protocol metadata generation"
http-8.0           nature=protocol  dir=http-8.0           summary="HTTP/8.0 protocol metadata generation"
http-9.0           nature=protocol  dir=http-9.0           summary="HTTP/9.0 experimental protocol generation (not IETF)"
cdma               nature=protocol  dir=cdma  sim=cdma/tools/cdma-sim  summary="CDMA reference models + simulator (cdma-sim)"
ofdma              nature=protocol  dir=ofdma              summary="OFDMA channelization models"
wifi-common        nature=protocol  dir=wifi-common        summary="Shared Wi-Fi contracts"
wi-fi-4            nature=protocol  dir=wi-fi-4            summary="Wi-Fi 4 (802.11n) model"
wi-fi-5            nature=protocol  dir=wi-fi-5            summary="Wi-Fi 5 (802.11ac) model"
wi-fi-6            nature=protocol  dir=wi-fi-6            summary="Wi-Fi 6 (802.11ax) model"
telephony-skya     nature=protocol  dir=telephony-skya     summary="Skya telephony stack"
resolver           nature=protocol  dir=resolver           summary="Shared target-validation resolver (resolve/validate)"
route              nature=protocol  dir=route              summary="Shared route-data contract (ROUTE.DATA.json)"
connector          nature=protocol  dir=connector          summary="Native data-source / transport connector"
preferred-routers  nature=protocol  dir=preferred-routers  summary="Preferred-router selection model"

# ---- tools: on-demand, one-shot toolchain components ------------------------
compiler      nature=tool  dir=compiler    bin=sleelac            summary="SLeeLa compiler toolchain component"
decompiler    nature=tool  dir=decompiler  bin=sleela-decompiler  summary="Slecompiler native-binary analysis/decompilation CLI"
debugger      nature=tool  dir=debugger    bin=sleela-debugger    summary="SLeeLa debugger"
native-drive  nature=tool  script=tools/sleela-native-drive.py  runsub=pipe  sub.service=tools/sleela-native-service.py  doc=impl/native-drive/README.md  summary="Shell-free C/C++ and supported SLeeLa AOT builds; process and XClass integration"
java-convert  nature=tool  dir=sleelactl/convert  bin=javaconv  doc=sleelactl/convert/README.md  summary="Java to SLeeLa converter (C lexer, C++ translator): converts a presumed JDK source tree to functionally equivalent SLeeLa under the conversion subject model; fails closed"

# ---- subjects: native C/C++ libraries compiled into the sleela runtime ------
# Reached from SLeeLa via `import <name>;` (impl/subjects/<dir>/). The honest way
# to exercise one from the CLI is to run its reference demo, so demo= is that
# demo. Demos under impl/ exist only in a source checkout.
math          nature=subject  demo=lib/ui/example/science/math.sleela          summary="Native math subject (__NativeMath: pi/e/sqrt/exp/log/sin/pow/clamp...); import math;"
physics       nature=subject  demo=lib/ui/example/science/physics.sleela       summary="Native physics subject (mechanics and physical models); import physics;"
chemistry     nature=subject  demo=lib/ui/example/science/chemistry.sleela     summary="Native chemistry subject (evidence-weighted chemistry support); import chemistry;"
astrophysics  nature=subject  demo=lib/ui/example/science/astrophysics.sleela  summary="Native astrophysics subject (astronomical formula models); import astrophysics;"
sociology     nature=subject  demo=lib/ui/example/science/sociology.sleela     summary="Native sociology subject (population and social-statistical measures); import sociology;"
economics     nature=subject  demo=impl/tests/subjects/economics_values.sleela summary="Native economics subject (economic and time-value functions); import economics;"
inference     nature=subject  demo=impl/tests/subjects/inference_values.sleela summary="Native inference subject (descriptive statistics and trend analysis); import inference;"
financial     nature=subject  demo=impl/examples/financial.sleela              summary="Native financial subject (valuation and algebra helpers); import financial;"
