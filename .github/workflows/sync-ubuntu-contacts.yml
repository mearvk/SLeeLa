name: Sync Ubuntu contacts

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/sync-ubuntu-contacts.yml"
      - "contacts/**"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout SLeeLa
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Copy contacts from Ubuntu.Determinant.Beta.Restricted
        run: |
          set -euo pipefail
          tmpdir="$(mktemp -d)"
          git clone --depth 1 --branch main https://github.com/mearvk/Ubuntu.Determinant.Beta.Restricted.git "$tmpdir/source"
          rm -rf contacts
          cp -a "$tmpdir/source/contacts" ./contacts
          rm -rf "$tmpdir"

      - name: Commit contacts
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add contacts
          if git diff --cached --quiet; then
            echo "contacts is already synchronized"
            exit 0
          fi
          git commit -m "Sync contacts from Ubuntu.Determinant.Beta.Restricted"
          git push origin HEAD:main
