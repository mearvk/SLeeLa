name: SLeeLa Test Suite
on:
  push:
    branches: [main, master]
  pull_request:
jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test suite
        run: bash ./test-suites/run-all.sh --all
      - name: Sanitizers
        run: bash ./test-suites/sanitizers/run.sh
      - name: Runtime coverage tooling
        run: bash ./test-suites/runtime-coverage.sh
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sleela-test-logs
          path: test-suites/logs/
