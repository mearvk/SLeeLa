name: Generate Repository SHA-256 Digests

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate digest document
        run: bash tools/generate-all-sha256-md.sh

      - name: Commit digest document
        run: |
          if git diff --quiet -- SHA256-DIGESTS.md; then
            echo "SHA256-DIGESTS.md is already current."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add SHA256-DIGESTS.md
          git commit -m "Generate repository SHA-256 digest document"
          git push
