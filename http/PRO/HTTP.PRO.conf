# SLeeLa HTTP PRO Configuration
# Version: 1.0
# Purpose: Explicitly select the cryptographic profile and security grade
# for HTTP/8.0 and compatible SLeeLa HTTP protocol implementations.
#
# This is configuration metadata, not a substitute for cryptographic
# authentication, authorization, key management, or local OS policy.
#
# Roles may edit policy within their authorized scope:
#   user   = endpoint/user preference
#   author = application/protocol author defaults
#   admin  = deployment/security policy
#
# Precedence is deployment-defined; an implementation MUST NOT silently
# weaken an admin-enforced minimum.

[pro]
enabled = true
profile = "standard"
protocol_grades = "HTTP/8.0"
security_grade = "HIGH"

# Supported crypto profile names are policy identifiers. The implementation
# should map them to an established cryptographic library/backend.
# Do not implement a new cipher from this file.
crypto = "X25519-HKDF-SHA256-AES-256-GCM"

# Key-agreement / transition requirements.
dh_handshake = "X25519"
key_derivation = "HKDF-SHA256"
aead = "AES-256-GCM"
require_key_confirmation = true
bind_transcript = true
bind_session_id = true
bind_bca_agreement = true
replay_protection = true
sequence_numbers = true
zeroize_key_memory = true

# Packet processing must occur only after authenticated crypto activation.
packet_policy = "AUTHENTICATE_BEFORE_PARSE"

# Security grades:
#   BASIC      = compatibility-oriented baseline
#   STANDARD   = authenticated transition and protected packets
#   HIGH       = STANDARD plus transcript/BCA binding, replay protection,
#                explicit confirmation, and zeroization
#   STRICT     = HIGH plus deployment-specific mandatory policy checks
#
# A higher grade is not automatically safer for every deployment; operators
# must verify library support, interoperability, performance, and policy.
minimum_security_grade = "STANDARD"

# Authorization flags. These select who may change this configuration.
allow_user_selection = true
allow_author_selection = true
allow_admin_selection = true
admin_may_enforce_minimum = true
user_may_weaken_admin_policy = false

# Protocol compatibility. List only grades that have an implementation which
# understands this PRO configuration. Multiple values are comma-separated.
compatible_http_grades = "HTTP/8.0,HTTP/7.0,HTTP/6.0"

# HTTP/8.0 gates remain independent from cryptographic activation.
require_subscription = true
require_radio_ready = true
require_international_context = true
require_binary_checker_agreement = true
require_two_way_safety_acceptance = true

# Failure behavior.
fail_closed_on_crypto_error = true
fail_closed_on_policy_error = true
log_key_material = false
log_plaintext_secrets = false
