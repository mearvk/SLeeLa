# SLVM/7 hardened runtime policy
vm.instance = 7
runtime.target = auto
runtime.adapter = auto
runtime.mode = native
runtime.compatibility = negotiated
runtime.migration = verified

security.profile = hardened-continuous-verification
security.fail_closed = true
security.fail_safe = true
security.policy_snapshot = immutable
security.policy_recheck = every_epoch
security.lineage = required
security.zeroization_on_fault = required

crypto.provider = platform
crypto.required = true
crypto.algorithm_policy = approved
link.policy = signed-hashed-reproducible
link.require_manifest = true
link.require_abi_match = true
link.require_build_identity = true

certificate.policy = required
certificate.rotation = required
certificate.lifecycle_evidence = required

observer.mode = evidence-chain
observer.redact_secrets = true
observer.checkpoints = required
observer.export_verification = required

log.manager = required
log.manager.mode = structured-integrity-chain
log.manager.fail_closed_on_security_log_failure = true
log.manager.redact_secrets = true
log.manager.sync_security_events = required
log.manager.retain_recovery_markers = required
log.manager.checkpoint_alignment = required
log.manager.integrity = chained

memory.manager = required
memory.manager.mode = bounded-checkpoint-aware
memory.limit = 536870912
memory.manager.guard_pages = preferred
memory.manager.zeroize_released_sensitive_memory = required
memory.manager.detect_budget_pressure = required
memory.manager.checkpoint_accounting = required

manager.registry = required
manager.dependency_validation = required
manager.startup_self_check = required
manager.shutdown_ordered = required
manager.partial_failure = quarantine

health.manager = required
health.manager.mode = watchdog
health.manager.heartbeat = required
health.manager.stall_detection = required
health.manager.resource_sampling = required

recovery.manager = required
recovery.mode = checkpointed-fail-safe
recovery.require_integrity = true
recovery.require_policy_match = true
recovery.max_recovery_attempts = 3
recovery.quarantine_after_exhaustion = true

checkpoint.manager = required
checkpoint.integrity = chained
checkpoint.atomic = required
checkpoint.replay_protection = required

broker.enabled = true
broker.require_encryption = true
broker.require_peer_identity = true
broker.require_freshness = true
broker.object_leases = required
broker.transaction_context = required
broker.lease_revocation = required

resolver.enabled = true
resolver.require_capability = true
resolver.require_authenticated_result = true
resolver.require_provenance = true
resolver.provenance_continuity = required
resolver.stale_result_policy = reject

isolation.profile = failure-domain-isolated
isolation.manager_fault = quarantine
resource.quota = enforced
resource.reservation = policy
resource.pressure_policy = checkpoint-then-throttle

determinism.mode = replayable
attestation.mode = multi-party
attestation.include_build_identity = true
attestation.include_policy_hash = true
attestation.include_lineage = true
attestation.include_manager_health = true
attestation.include_recovery_state = true

migration.mode = verified
migration.require_manager_compatibility = true
migration.require_checkpoint = true
migration.revalidate_after_transfer = true

compliance.profile = hardened-baseline
