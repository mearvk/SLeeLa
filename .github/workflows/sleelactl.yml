name: sleelactl

on:
  push:
    paths:
      - '.github/workflows/sleelactl.yml'
      - 'bin/sleelactl'
      - 'bin/sleelactl.d/**'
      - 'bin/SLEELACTL.md'
      - 'tests/sleelactl_*_test.sh'
  pull_request:
    paths:
      - 'bin/sleelactl'
      - 'bin/sleelactl.d/**'
      - 'tests/sleelactl_*_test.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sleelactl:
    name: sleelactl (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check (POSIX sh)
        run: sh -n bin/sleelactl
      - name: Validate the module registry
        run: bin/sleelactl check-registry --strict
      - name: Functional contract tests (/bin/sh; dash on Ubuntu)
        run: sh tests/sleelactl_cli_test.sh
      - name: systemd scope tests
        run: sh tests/sleelactl_systemctl_scope_test.sh
      - name: Functional contract tests under dash explicitly
        if: runner.os == 'Linux'
        run: |
          command -v dash >/dev/null || sudo apt-get install -y dash
          dash -n bin/sleelactl
          dash bin/sleelactl check-registry --strict
          dash tests/sleelactl_cli_test.sh
          dash tests/sleelactl_systemctl_scope_test.sh

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck sleelactl and its tests (POSIX sh)
        continue-on-error: true
        run: |
          shellcheck --version
          shellcheck -s sh -f gcc bin/sleelactl tests/sleelactl_cli_test.sh tests/sleelactl_systemctl_scope_test.sh
