name: Sleelavirin Antivirus CI

on:
  push:
    branches: [main, master]
    paths:
      - "antivirus/**"
      - ".github/workflows/antivirus.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "antivirus/**"
      - ".github/workflows/antivirus.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Antivirus build and tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Set up Windows compiler and make
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            make
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-python
      - name: Build and test on Unix
        if: runner.os != 'Windows'
        run: |
          make -C antivirus clean
          make -C antivirus test
      - name: Build and test on Windows (MSYS2)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          make -C antivirus clean
          make -C antivirus test
