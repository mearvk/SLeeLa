name: SLeeLa Connector CI

on:
  push:
    branches: [main, master]
    paths:
      - "lib/connector/**"
      - ".github/workflows/connector-ci.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "lib/connector/**"
      - ".github/workflows/connector-ci.yml"
  workflow_dispatch:

concurrency:
  group: connector-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-connectors:
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install native dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config default-libmysqlclient-dev libsqlite3-dev libpq-dev unixodbc-dev libcurl4-openssl-dev libxml2-dev libmosquitto-dev
      - name: Install native dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install pkg-config mariadb-connector-c sqlite libpq unixodbc curl libxml2 mosquitto cjson
          echo "$(brew --prefix libpq)/bin" >> "$GITHUB_PATH"
          echo "PKG_CONFIG_PATH=$(brew --prefix libpq)/lib/pkgconfig:$(brew --prefix libxml2)/lib/pkgconfig:$(brew --prefix curl)/lib/pkgconfig:$(brew --prefix mariadb-connector-c)/lib/pkgconfig:$(brew --prefix cjson)/lib/pkgconfig" >> "$GITHUB_ENV"
      - name: Build all connector families through group Makefile
        run: make -C lib/connector build
      - name: Run group smoke tests
        run: make -C lib/connector test
      - name: Clean all connector outputs
        if: always()
        run: make -C lib/connector clean
