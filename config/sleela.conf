# SLeeLa Unified Configuration
# Max Rupplin - MEARVK LLC - 2026
#
# This is the single authoritative configuration-location policy.
# Paths may be absolute or project-relative according to config.path.mode.

[project]
# Logical project name. Used to derive the project root when project.root is
# not supplied by the launcher/environment.
name = "SLeeLa"

# Absolute project root. Set this for an installed project or a checkout.
# Example: /opt/sleela or /home/user/projects/SLeeLa
root = ""

[config]
# The canonical configuration directory. When mode=project, this is resolved
# from project.root + relative_path. When mode=absolute, absolute_path wins.
mode = "project"
relative_path = ".sleela/config"
absolute_path = ""

# Keep all runtime/compiler/VM configuration beneath this directory.
# Individual components must not invent parallel configuration roots.
single_root = true

[install]
# Optional absolute installation root. If empty, the launcher discovers it
# from the executable location.
root = ""

[vm]
# VM selected by the user/admin/developer. Supported VM family: 1 through 11.
# Example: 1, 7, or 11.
version = "11"

# Optional per-project VM configuration is stored under:
# <resolved-config-root>/vm/vm-<version>.conf
config_filename_pattern = "vm/vm-{version}.conf"

[gc]
# Standard GC configuration for VMs 1..11.
# Each VM may override these values in its vm-<version>.conf file.
mode = "standard"
profile = "balanced"
startup_collect = false
verify_on_shutdown = false

[discovery]
# Search order for the canonical configuration root.
# project -> explicit absolute path -> install -> executable -> environment
allow_environment_override = true
environment_variable = "SLEELA_CONFIG_ROOT"
require_absolute_resolved_path = true

[compatibility]
schema = "1"
fail_on_missing_project = true
allow_legacy_component_config = false
