name: Audio API CI

on:
  push:
    paths:
      - 'audio/**'
      - 'impl/core/sleela_core.*'
      - 'impl/core/sleela_audio_bridge.*'
      - 'impl/frontend/compiler.cpp'
      - 'impl/frontend/semantic.cpp'
      - 'impl/frontend/driver.cpp'
      - '.github/workflows/audio-ci.yml'
  pull_request:
    paths:
      - 'audio/**'
      - 'impl/core/sleela_core.*'
      - 'impl/core/sleela_audio_bridge.*'
      - 'impl/frontend/compiler.cpp'
      - 'impl/frontend/semantic.cpp'
      - 'impl/frontend/driver.cpp'
      - '.github/workflows/audio-ci.yml'

jobs:
  build-audio:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build C audio
        working-directory: audio/c
        run: make clean all test
      - name: Build C++ audio
        working-directory: audio/cpp
        run: make clean all test
      - name: Build native audio adapter
        working-directory: audio/native
        run: make clean all test
      - name: Validate SLeeLa Audio source layer
        run: |
          set -eu
          test "$(find audio/sleela -maxdepth 1 -name '*.sleela' | wc -l)" -eq 9
          for f in audio/sleela/*.sleela; do
            grep -q '^#sleela 1.3$' "$f"
            grep -q '^class ' "$f"
            grep -q 'static ' "$f"
          done
      - name: Compile SLVM Audio C++ bridge
        run: |
          mkdir -p /tmp/sleela-audio-ci
          g++ -std=c++17 -Wall -Wextra -Wpedantic -Werror             -Iimpl/core -I. -Iaudio/cpp/include             -c impl/core/sleela_audio_bridge.cpp             -o /tmp/sleela-audio-ci/sleela_audio_bridge.o
      - name: Compile Java audio API
        working-directory: audio/java
        run: mkdir -p build/classes && javac -d build/classes src/module-info.java src/com/mearvk/sleela/audio/*.java
      - name: Compile JavaFX audio GUI
        working-directory: audio/gui
        run: mvn -B -DskipTests package
