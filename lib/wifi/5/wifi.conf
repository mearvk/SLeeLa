# SLeeLa Wi-Fi 5 static reference profile
# Values are descriptive defaults, not adapter settings.
profile_name=wifi5-802.11ac
standard=IEEE 802.11ac
bands_ghz=5
channel_widths_mhz=20,40,80,160
maximum_spatial_streams=8
maximum_qam_order=256
theoretical_peak_phy_mbps=6933
runtime_capability_discovery=required
regulatory_domain=runtime
channel_plan=runtime
security_policy=prefer_wpa3;allow_wpa2_aes_ccmp_if_needed;deny_wep;deny_tkip
radio_control=operating_system_or_driver
