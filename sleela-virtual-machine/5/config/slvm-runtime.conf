# SLVM/5 runtime policy
vm.instance = 5
runtime.target = auto
runtime.adapter = auto
runtime.mode = native
runtime.compatibility = negotiated

security.profile = reproducible-distributed-secure
security.fail_closed = true
security.policy_snapshot = immutable
security.policy_version = required

crypto.provider = platform
crypto.required = true
crypto.algorithm_policy = approved
crypto.key_rotation = policy

link.policy = signed-hashed-reproducible
link.require_manifest = true
link.require_abi_match = true
link.require_capability_declarations = true
link.require_build_identity = true

certificate.policy = required
certificate.trust_store = platform
certificate.pinning = policy
certificate.rotation = required

observer.mode = durable-correlated
observer.redact_secrets = true
observer.checkpoints = required
observer.sequence = required

broker.enabled = true
broker.require_encryption = true
broker.require_peer_identity = true
broker.require_freshness = true
broker.object_leases = required
broker.transaction_context = required

resolver.enabled = true
resolver.require_capability = true
resolver.require_authenticated_result = true
resolver.require_provenance = true

isolation.profile = fault-contained
resource.quota = enforced
resource.reservation = policy
determinism.mode = replayable

attestation.mode = required
attestation.include_manifest = true
attestation.include_build_identity = true
attestation.include_policy_hash = true

recovery.mode = checkpointed
recovery.require_integrity = true

compliance.profile = baseline
memory.limit = 536870912
