name: Repair SleelaTerminal build

on:
  push:
    branches:
      - master

permissions:
  contents: write

jobs:
  repair:
    if: ${{ github.event.head_commit.message != 'Repair SleelaTerminal build [skip ci]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply C++ fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('sleela-terminal/sleelaterminal-gui.cpp')
          s = p.read_text()
          s = s.replace(
              'G_SUBPROCESS_FLAGS_STDOUT_PIPE | G_SUBPROCESS_FLAGS_STDERR_PIPE',
              'static_cast<GSubprocessFlags>(G_SUBPROCESS_FLAGS_STDOUT_PIPE | G_SUBPROCESS_FLAGS_STDERR_PIPE)',
              1,
          )
          s = s.replace(
              '        if (error) g_error_free(error); return;\n',
              '        if (error) {\n            g_error_free(error);\n        }\n        return;\n',
              1,
          )
          s = s.replace(
              '        }), payload, [](gpointer data) { delete static_cast<Payload *>(data); }, G_CONNECT_AFTER);',
              '        }), payload, [](gpointer data, GClosure *) {\n            delete static_cast<Payload *>(data);\n        }, G_CONNECT_AFTER);',
              1,
          )
          p.write_text(s)
          PY
          git diff --check
          git diff --exit-code && exit 0 || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sleela-terminal/sleelaterminal-gui.cpp
          git commit -m 'Repair SleelaTerminal build [skip ci]'
          git push
