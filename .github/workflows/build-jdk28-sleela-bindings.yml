name: Build JDK 28 SLeeLa Bindings

on:
  push:
    branches: [master]

jobs:
  generate:
    if: github.actor == 'mearvk'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Generate remaining JDK 28 framework bindings
        run: |
          python3 - <<'PY'
          from pathlib import Path

          families = {
            "java/compiler/javax/lang/model/element": ["Element","ModuleElement","PackageElement","TypeElement","VariableElement","ExecutableElement"],
            "java/compiler/javax/lang/model/type": ["TypeMirror","ArrayType","DeclaredType","ExecutableType","PrimitiveType","TypeVariable","WildcardType"],
            "java/compiler/javax/lang/model/util": ["Elements","Types","ElementScanner14","SimpleElementVisitor14","TypeScanner14"],
            "java/compiler/javax/tools": ["JavaCompiler","JavaFileObject","JavaFileManager","Diagnostic","ToolProvider"],
            "java/instrument": ["Instrumentation"],
            "java/logging": ["Logger","Level","Handler","LogRecord","Formatter"],
            "java/management": ["ManagementFactory","MemoryMXBean","ThreadMXBean","RuntimeMXBean"],
            "java/naming": ["Context","InitialContext","Name","NamingException"],
            "java/prefs": ["Preferences","BackingStoreException"],
            "java/rmi": ["Remote","RemoteException","Naming"],
            "java/sql": ["Connection","Driver","DriverManager","PreparedStatement","ResultSet","Statement","SQLException"],
            "java/xml": ["DocumentBuilder","DocumentBuilderFactory","SAXParser","SAXParserFactory","Transformer","TransformerFactory"],
            "java/xml/crypto": ["XMLSignature","XMLSignatureFactory","KeySelector","URIDereferencer"],
            "java/desktop/java/awt": ["Component","Container","EventQueue","Graphics","Toolkit"],
            "java/desktop/java/awt/event": ["ActionEvent","ActionListener","KeyEvent","MouseEvent","WindowEvent"],
            "java/desktop/javax/swing": ["JFrame","JPanel","JButton","JLabel","JTextField","JTextArea","JTable","JTree"],
            "java/desktop/javax/imageio": ["ImageIO"],
            "java/security/cert": ["Certificate","CertificateFactory","CertPath","CertPathValidator","X509Certificate"],
            "java/security/spec": ["AlgorithmParameterSpec","ECGenParameterSpec","NamedParameterSpec","RSAKeyGenParameterSpec"],
            "java/security": ["AlgorithmParameters","KeyFactory","KeyPairGenerator","KeyStore","SecureRandom","Signature","Security"],
            "java/crypto": ["Cipher","KeyAgreement","KeyGenerator","Mac","SecretKeyFactory"],
            "java/ssl": ["SSLContext","SSLSocket","SSLSocketFactory","TrustManagerFactory","KeyManagerFactory"],
            "java/net/http": ["HttpClient","HttpRequest","HttpResponse","WebSocket"],
            "java/util/stream": ["Stream","IntStream","LongStream","DoubleStream","Collectors"],
            "java/util/function": ["Function","Consumer","Supplier","Predicate","BiFunction","BiConsumer"],
            "java/util/concurrent": ["Executor","ExecutorService","ScheduledExecutorService","Future","CompletableFuture","CompletionStage","ConcurrentHashMap","ConcurrentLinkedQueue","Semaphore","CountDownLatch"],
            "java/util/jar": ["JarFile","JarEntry","JarOutputStream","Manifest"],
            "java/util/zip": ["ZipFile","ZipEntry","ZipInputStream","ZipOutputStream","GZIPInputStream","GZIPOutputStream"],
            "java/text": ["Format","DateFormat","NumberFormat","DecimalFormat","MessageFormat"],
            "java/regex": ["Pattern","Matcher"],
            "java/lang/invoke": ["MethodHandle","MethodHandles","MethodType","CallSite","VarHandle"],
            "java/lang/module": ["ModuleDescriptor","ModuleFinder","ModuleReference"],
            "java/lang/management": ["MemoryMXBean","OperatingSystemMXBean","RuntimeMXBean","ThreadMXBean"],
            "java/lang/foreign": ["Arena","MemorySegment","MemoryLayout","Linker","SymbolLookup","FunctionDescriptor"],
            "jdk/httpserver/com/sun/net/httpserver": ["HttpServer","HttpsServer","HttpExchange","HttpHandler","HttpContext","HttpPrincipal","SimpleFileServer"],
            "jdk/javadoc/jdk/javadoc/doclet": ["Doclet","Reporter","DocletEnvironment"],
            "jdk/jfr/jdk/jfr": ["Event","Recording","FlightRecorder","RecordingFile"],
            "jdk/management/jdk/management": ["ThreadMXBean"],
            "jdk/jartool/jdk/security/jarsigner": ["JarSigner"],
            "jdk/incubator/vector/jdk/incubator/vector": ["VectorSpecies","VectorShape","IntVector","LongVector","FloatVector","DoubleVector"],
            "jdk/incubator/json/jdk/incubator/json": ["JsonParser","JsonValue","JsonObject","JsonArray"],
          }

          for family, names in families.items():
              directory = Path("lib/java") / family
              directory.mkdir(parents=True, exist_ok=True)
              for name in names:
                  p = directory / f"{name}.sleela"
                  if p.exists():
                      continue
                  java_type = family.replace("/", ".") + "." + name
                  p.write_text(
                      "/*\\n"
                      f" * {p.as_posix()}\\n"
                      " * SLeeLa JDK 28 Framework Binding.\\n"
                      f" * Definition: Controlled SLeeLa binding for the JDK 28 framework type {java_type}.\\n"
                      " * This source describes the framework contract without copying Java implementation code.\\n"
                      " */\\n"
                      "#sleela 1.3\\n\\n"
                      f"class {name} {{\\n"
                      f'  String javaType = "{java_type}";\\n'
                      "  String typeName() { return javaType; }\\n"
                      "  boolean available() { return javaType != \"";\\n"
                      "}\\n",
                      encoding="utf-8")
          PY
      - name: Commit generated bindings and remove generator
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/java
          git rm .github/workflows/build-jdk28-sleela-bindings.yml
          git commit -m "Complete JDK 28 SLeeLa framework binding coverage"
          git push origin HEAD:master
