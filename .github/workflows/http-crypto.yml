name: HTTP 3.0 Crypto

on:
  push:
    paths:
      - 'http-3.0/**'
      - '.github/workflows/http-crypto.yml'
  pull_request:
    paths:
      - 'http-3.0/**'
      - '.github/workflows/http-crypto.yml'

jobs:
  build-and-self-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install OpenSSL development headers
        run: sudo apt-get update && sudo apt-get install -y libssl-dev pkg-config

      - name: Build and run C self-test
        working-directory: http-3.0
        run: make clean all && ./crypto_selftest

      - name: Check C++ interface
        working-directory: http-3.0
        run: make cpp-check

      - name: Run HTTP 3.0 data-flow demo (envelope / naming / pipeline)
        working-directory: http-3.0
        run: ./http3_pipeline_demo

      - name: Run HTTP 3.0 data-flow Python tests
        working-directory: http-3.0
        run: python3 test_http3_flow.py
