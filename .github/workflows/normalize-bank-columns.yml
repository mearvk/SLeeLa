name: Normalize BANKS Column Names

on:
  workflow_dispatch:

jobs:
  normalize-columns:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Normalize BANKS column names
        run: python3 tools/normalize-bank-columns.py
      - name: Commit normalized columns
        run: |
          git config user.name "SLeeLa BANKS Column Normalizer"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BANKS.md
          git diff --cached --quiet || git commit -m "Normalize BANKS column names"
          git push origin HEAD:master
