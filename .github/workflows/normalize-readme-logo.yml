name: Normalize SLeeLa README Logo

on:
  push:
    paths:
      - ".github/workflows/normalize-readme-logo.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Put SLeeLa logo first in every README
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          logo = '<img src="https://github.com/mearvk/SLeeLa/blob/master/images/sleela-logo-004.jpg" alt="SLeeLa">'
          for path in Path(".").rglob("README.md"):
              if ".git" in path.parts: continue
              text = path.read_text(encoding="utf-8")
              text = re.sub(r'^[^\n]*sleela-logo-004\.jpg[^\n]*(?:\n|$)', '', text, flags=re.IGNORECASE | re.MULTILINE)
              text = text.lstrip("\ufeff\r\n")
              path.write_text(logo + "\n\n" + text, encoding="utf-8")
          PY

      - name: Commit README updates and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git rm -f .github/workflows/normalize-readme-logo.yml
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Place SLeeLa logo first in every README"
          git push origin "HEAD:\${GITHUB_REF_NAME}"
