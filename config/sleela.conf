# SLeeLa unified runtime configuration
# Max Rupplin - MEARVK LLC - 2026
# config/config-location.conf is the authoritative location policy parsed by
# runtime/config_location.c. Keep the mirrored path values below aligned.

[project]
name = "SLeeLa"
root = ""

[config]
mode = "project"
relative_path = ".sleela/config"
absolute_path = "/etc/sleela"
single_root = true

[install]
root = ""
relative_path = "Config"

[vm]
version = "11"
config_filename_pattern = "vm/vm-{version}.conf"

[gc]
mode = "standard"
profile = "balanced"
startup_collect = false
verify_on_shutdown = false

[discovery]
allow_environment_override = true
environment_variable = "SLEELA_CONFIG_ROOT"
require_absolute_resolved_path = true
precedence = "explicit,environment,project,install,system"

[compatibility]
schema = "1"
fail_on_missing_project = true
allow_legacy_component_config = false
