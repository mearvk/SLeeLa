name: GUI Bridge CI

on:
  push:
    paths:
      - 'gui/**'
      - 'lib/gui/**'
      - '.github/workflows/gui-ci.yml'
  pull_request:
    paths:
      - 'gui/**'
      - 'lib/gui/**'
      - '.github/workflows/gui-ci.yml'

jobs:
  build-gui:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and test the native GUI bridge (Path 3 ABI)
        working-directory: gui/native
        run: make clean all test

      - name: Validate the SLeeLa gui source layer (lib/gui)
        run: |
          set -eu
          # 9 Master Classes + SLPackage facade + runnable demo = 11 units.
          test "$(find lib/gui -maxdepth 1 -name '*.sleela' | wc -l)" -eq 11
          test -f lib/gui/SLPackage.sleela
          test -f lib/gui/gui-demo.sleela
          for f in lib/gui/*.sleela; do
            grep -q '^#sleela 1.3$' "$f"
            grep -q '^class ' "$f"
          done

      - name: Compile the native GUI bridge standalone (ABI sanity)
        run: |
          set -eu
          mkdir -p /tmp/sleela-gui-ci
          g++ -std=c++17 -Wall -Wextra -Wpedantic -Werror \
            -c gui/native/sleela_gui_bridge.cpp \
            -o /tmp/sleela-gui-ci/sleela_gui_bridge.o
