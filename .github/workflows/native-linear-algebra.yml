name: Native linear algebra C ABI

on:
  push:
    paths:
      - '.github/workflows/native-linear-algebra.yml'
      - 'impl/subjects/math/linear_algebra.cpp'
      - 'impl/subjects/math/linear_algebra.h'
      - 'impl/tests/subjects/linear_algebra_smoke.cpp'
  pull_request:
    paths:
      - '.github/workflows/native-linear-algebra.yml'
      - 'impl/subjects/math/linear_algebra.cpp'
      - 'impl/subjects/math/linear_algebra.h'
      - 'impl/tests/subjects/linear_algebra_smoke.cpp'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linear-algebra:
    name: Linear algebra C ABI (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run native C ABI smoke test (POSIX)
        if: runner.os != 'Windows'
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Iimpl/subjects/math impl/subjects/math/linear_algebra.cpp impl/tests/subjects/linear_algebra_smoke.cpp -o linear-algebra-smoke
          ./linear-algebra-smoke
      - name: Initialize MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Compile and run native C ABI smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cl /nologo /std:c++17 /O2 /W4 /Iimpl/subjects/math impl/subjects/math/linear_algebra.cpp impl/tests/subjects/linear_algebra_smoke.cpp /Felinear-algebra-smoke.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\linear-algebra-smoke.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
