# SLeeLa VM 1..11 configuration template
# Installed/copied to the canonical configuration root as:
# vm/vm-<version>.conf
#
# The selected version is controlled by config/sleela.conf.

[vm]
version = "11"
name = "SLVM"
enabled = true

[gc]
mode = "standard"
profile = "balanced"
heap_initial_mb = 32
heap_max_mb = 2048
collect_threshold_percent = 75
verify_on_shutdown = false

# VM-family compatibility. This template is valid for VM 1 through VM 11.
# A generated per-version file may change only the version and documented
# compatibility fields.
supported_min = 1
supported_max = 11

[java]
# Java is a secondary process boundary, not an embedded VM capability.
enabled = true
mode = "external"
executable = "auto"
classpath = "."
javafx_module_path = ""
javafx_modules = "javafx.controls,javafx.graphics"
headless = "auto"
# "embedded" is reserved for a future explicitly built and tested JNI provider.
