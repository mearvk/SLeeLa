name: SLeeLa SQL Native CI

on:
  push:
    paths:
      - "lib/sleela-sql/**"
      - ".github/workflows/sleela-sql.yml"
  pull_request:
    paths:
      - "lib/sleela-sql/**"
      - ".github/workflows/sleela-sql.yml"
  workflow_dispatch:

jobs:
  native-build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up MinGW-w64
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc make
      - name: Build C engine, CLI, and C++ facade (Unix)
        if: runner.os != 'Windows'
        run: make -C lib/sleela-sql clean all
      - name: Build C engine, CLI, and C++ facade (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: make -C lib/sleela-sql clean all
      - name: Run C and C++ smoke tests (Unix)
        if: runner.os != 'Windows'
        run: make -C lib/sleela-sql test
      - name: Run C and C++ smoke tests (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: make -C lib/sleela-sql test
