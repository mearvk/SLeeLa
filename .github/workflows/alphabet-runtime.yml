name: Alphabet and Character Runtime

on:
  push:
    branches: [main, master]
    paths:
      - 'alphabet/sleela/**'
      - 'lib/alphabet/**'
      - 'utf-4088/**'
      - 'tools/sleela-character-scan.py'
      - 'tools/tests/test_sleela_character_scan.py'
      - '.github/workflows/alphabet-runtime.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'alphabet/sleela/**'
      - 'lib/alphabet/**'
      - 'utf-4088/**'
      - 'tools/sleela-character-scan.py'
      - 'tools/tests/test_sleela_character_scan.py'
      - '.github/workflows/alphabet-runtime.yml'
  workflow_dispatch:

jobs:
  native-alphabet:
    name: Alphabet runtime (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Configure alphabet runtime
        run: cmake -S lib/alphabet/native -B build-alphabet -DCMAKE_BUILD_TYPE=Release
      - name: Build alphabet runtime
        run: cmake --build build-alphabet --config Release --parallel
      - name: Test alphabet runtime
        run: ctest --test-dir build-alphabet -C Release --output-on-failure
      - name: Configure UTF-4088 catalogue
        run: cmake -S utf-4088 -B build-utf4088 -DCMAKE_BUILD_TYPE=Release
      - name: Build UTF-4088 catalogue
        run: cmake --build build-utf4088 --config Release --parallel
      - name: Test UTF-4088 catalogue
        run: ctest --test-dir build-utf4088 -C Release --output-on-failure
      - name: Test read-only catalogue scanner
        run: python -m unittest tools/tests/test_sleela_character_scan.py
