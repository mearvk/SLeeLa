# http3_service.example.conf -- per-service HTTP 3.0 configuration for SLeeLa.
#
# A SLeeLa deployment maps each service to an HTTP color (from
# http3_colors.conf). The connector reads this file, resolves the named color
# to a profile, and configures the pipeline for that service accordingly.
#
# Columns (whitespace-separated):
#   service    service name (as registered via fast naming)
#   color      HTTP color name from http3_colors.conf
#
# service   color
orders      red
billing     black
catalog     green
telemetry   amber
