# HTTP/8.0 PRO early-transition security policy
# RSA is used for the authenticated control plane; DH/KEM remains responsible
# for session key agreement. RSA-2048 is the minimum accepted key size.
minimum_rsa_bits = 2048
require_rsa_control_plane = true
require_transition_authentication = true
require_replay_protection = true
fail_closed_on_policy_error = true
