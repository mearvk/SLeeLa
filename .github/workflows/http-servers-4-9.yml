name: HTTP 4-9 Servers
on:
  push:
    branches: [main, master]
    paths: ["http-servers/4/**","http-servers/5/**","http-servers/6/**","http-servers/7/**","http-servers/8/**","http-servers/9/**",".github/workflows/http-servers-4-9.yml"]
  pull_request:
    paths: ["http-servers/4/**","http-servers/5/**","http-servers/6/**","http-servers/7/**","http-servers/8/**","http-servers/9/**"]
jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        grade: [4, 5, 6, 7, 8, 9]
    steps:
      - uses: actions/checkout@v4
      - name: Build and smoke test
        run: make -C http-servers/${{ matrix.grade }} clean all test
