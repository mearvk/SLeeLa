name: SLeeLa Test Suite
# README logo normalization is performed on branch pushes and PR branches.
on:
  push:
    branches: [main, master]
  pull_request:
permissions:
  contents: read
# Serialize this workflow per branch. The retry loop below also handles pushes
# from other workflows that cannot share this concurrency group.
concurrency:
  group: sleela-test-suite-${{ github.ref }}
  cancel-in-progress: false
jobs:
  linux:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Keep test execution read-only. Documentation normalization and cross-repo sync
      # should run as dedicated workflows, not race contributor commits during CI.
      - name: Test suite
        run: bash ./test-suites/run-all.sh --all
      - name: SleelaTerminal build, regression, and staged-install checks
        run: make -C sleela-terminal clean all test install-smoke
      - name: All SLeeLa source inputs, outputs, and procedural operations
        run: bash ./test-suites/sleela-source-behavior.sh
      - name: Sanitizers
        if: always()
        run: bash ./test-suites/sanitizers/run.sh
      - name: Runtime coverage tooling
        if: always()
        run: bash ./test-suites/runtime-coverage.sh
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sleela-test-logs
          path: test-suites/logs/
