name: Apply SecureJDK 28 footer integration v2

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply footer integration
        run: python3 sleela-terminal/tools/patch_securejdk_footer.py
      - name: Add software-center files
        run: |
          mkdir -p sleela-terminal/assets sleela-terminal/tools/install
          cat > sleela-terminal/assets/securejdk28-cmd.svg <<'EOF'
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96"><defs><linearGradient id="o" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#e9c8ff"/><stop offset=".45" stop-color="#8a5bb7"/><stop offset="1" stop-color="#40205f"/></linearGradient><linearGradient id="r" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#ff6674"/><stop offset=".55" stop-color="#d9162d"/><stop offset="1" stop-color="#8f0b1e"/></linearGradient><linearGradient id="p" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#ffe9f0"/><stop offset="1" stop-color="#c98da1"/></linearGradient></defs><rect x="3" y="3" width="90" height="90" rx="20" fill="url(#o)"/><rect x="9" y="9" width="78" height="78" rx="17" fill="#fff"/><rect x="14" y="14" width="68" height="68" rx="14" fill="url(#r)"/><rect x="22" y="22" width="52" height="52" rx="11" fill="#702238" opacity=".55"/><rect x="25" y="25" width="46" height="46" rx="10" fill="url(#p)"/><g fill="none" stroke="#7b4353" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round"><path d="M48 33c5-4 7-7 5-11"/><path d="M47 42c-7-5-7-10-1-15"/><path d="M37 46c4 3 17 3 22 0"/><path d="M40 50c4 3 13 3 17 0"/><path d="M38 55c5 4 15 4 20 0"/><path d="M34 59c7 5 21 5 28 0"/><path d="M34 64c8 4 20 4 28 0"/><path d="M63 51c6-2 8 3 4 6"/></g></svg>
          EOF
          cat > sleela-terminal/tools/install/sleela-software.sh <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          REPO="${SLEELA_SOFTWARE_REPO:-mearvk/Ubuntu.Determinant.Beta.Restricted}"
          ROOT="${SLEELA_SOFTWARE_ROOT:-$HOME/.local/share/sleela/software}"
          API="https://api.github.com/repos/${REPO}/releases?per_page=20"
          usage(){ echo "Usage: $0 scan | install <securejdk28|cmd|asysma|all>"; }
          scan(){
            echo "SleelaTerminal Software Scan"
            echo "GitHub source: https://github.com/${REPO}"
            command -v curl >/dev/null 2>&1 || { echo "curl is required." >&2; exit 2; }
            if command -v python3 >/dev/null 2>&1; then
              curl -fsSL "$API" | python3 -c 'import json,sys; d=json.load(sys.stdin); print("Release state:"); [print(f"  {r.get(\"tag_name\",\"untagged\")} — {\"ALPHA/PRE-RELEASE\" if r.get(\"prerelease\") else \"FINAL\"}{\" — DRAFT\" if r.get(\"draft\") else \"\"}") for r in d[:10]]; print("Latest published final: "+next((r.get("tag_name","") for r in d if not r.get("prerelease") and not r.get("draft")),"none"))'
            else
              curl -fsSL "$API" | grep -E '"tag_name"|"prerelease"|"draft"' | head -30 || true
            fi
            echo "Scan is read-only. Installation requires an explicit action."
          }
          install_one(){
            local product="$1"; local dest="$ROOT/$product"; mkdir -p "$ROOT"
            if [ -e "$dest/.git" ]; then git -C "$dest" fetch --tags --prune origin; git -C "$dest" pull --ff-only origin HEAD || true
            else rm -rf "$dest"; git clone "https://github.com/${REPO}.git" "$dest"; fi
            if [ -f "$dest/install.sh" ]; then (cd "$dest" && bash ./install.sh)
            elif [ -f "$dest/scripts/install.sh" ]; then (cd "$dest" && bash ./scripts/install.sh)
            else echo "Prepared latest GitHub source for $product at: $dest"; echo "No repository-provided installer was found; no privileged system changes were made."; fi
          }
          case "${1:-}" in scan) scan;; install) case "${2:-}" in securejdk28|cmd|asysma) install_one "$2";; all) for p in securejdk28 cmd asysma; do install_one "$p"; done;; *) usage; exit 2;; esac;; *) usage; exit 2;; esac
          EOF
          chmod 0644 sleela-terminal/tools/install/sleela-software.sh
      - name: Document software center
        run: |
          cat > sleela-terminal/SOFTWARE.md <<'EOF'
          # SecureJDK 28 / CMD Software Center

          The SleelaTerminal footer contains a compact Java/SecureJDK-style action icon based on the supplied visual reference. Clicking it opens a software center.

          ## Scan

          **Scan GitHub Releases** queries the configured GitHub repository for published release metadata and distinguishes final releases from prereleases/alpha states. The scan is read-only.

          ## Installation / Preparation

          The first implementation refreshes or clones source under `~/.local/share/sleela/software/` and runs a repository-provided `install.sh` or `scripts/install.sh` when one exists. If the source repository has no installer, the source is prepared locally without privileged system changes.

          This is deliberately not a `curl | sh` mechanism. A future product manifest can attach SecureJDK 28, CMD, Asysma, or other products to their own release assets and verified build/install commands.

          The canonical SecureJDK 28 design documentation is in `Ubuntu.Determinant.Beta.Restricted/markdown/SECUREJDK28.md`.

          **SleelaTerminal™ — MEARVK LLC**
          EOF
      - name: Commit integration and remove one-time helpers
        run: |
          rm -f .github/workflows/apply-securejdk-footer.yml .github/workflows/apply-securejdk-footer-v2.yml sleela-terminal/tools/patch_securejdk_footer.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sleela-terminal .github/workflows/apply-securejdk-footer.yml .github/workflows/apply-securejdk-footer-v2.yml
          git diff --cached --quiet || git commit -m "Add SecureJDK 28 software center to SleelaTerminal [skip ci]"
          git push
