role=both
listen.host=localhost
listen.port=8443
default.room=lobby
control.guia.host=127.0.0.1
control.guia.port=8700
control.http2.enabled=true
control.http3.enabled=true
control.preferred=http3
# Crypto is optional/opportunistic: connections run plaintext if either side has
# no certificate. The Java/Guia layer implements it (SkyaCrypto); the .sleela VM
# has no DH/DSA and always negotiates plaintext.
security.crypto.enabled=true
security.crypto.dh.bits=2048
security.crypto.dsa.bits=2048
security.crypto.cipher=AES-256-GCM
security.certificate.validity.days=30
security.certificate.renew.window.days=5
security.certificate.required=false
nat.ipv4.discovery=true
nat.ipv6.enabled=true
nat.relay.enabled=true
firewall.manage=false
media.audio.enabled=true
media.video.enabled=true
file-transfer.enabled=true
room.max-peers=256
