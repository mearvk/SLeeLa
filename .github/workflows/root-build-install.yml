name: Root Build and Install Qualification

on:
  push:
    branches: [master, main]
    paths:
      - 'Makefile'
      - 'install/**'
      - 'impl/**'
      - 'runtime/**'
      - 'lib/**'
      - 'java28/**'
      - 'regex/**'
      - 'tests/**'
      - 'codecs/**'
      - 'churn/**'
      - 'antivirus/**'
      - 'registry/**'
      - 'ballum/**'
      - 'common-rails/**'
      - 'config/**'
      - 'sleela-scripting/**'
      - 'jetbrains/**'
      - '.github/workflows/root-build-install.yml'
  pull_request:
    branches: [master, main]
    paths:
      - 'Makefile'
      - 'install/**'
      - 'impl/**'
      - 'runtime/**'
      - 'lib/**'
      - 'java28/**'
      - 'regex/**'
      - 'tests/**'
      - 'codecs/**'
      - 'churn/**'
      - 'antivirus/**'
      - 'registry/**'
      - 'ballum/**'
      - 'common-rails/**'
      - 'config/**'
      - 'sleela-scripting/**'
      - 'jetbrains/**'
      - '.github/workflows/root-build-install.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  root-posix:
    name: Root make all (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config python3 python3-pip openjdk-21-jdk libssl-dev libx11-dev libxrandr-dev libfreetype-dev libfontconfig1-dev

      - name: Install macOS build dependencies
        if: runner.os == 'macOS'
        run: |
          brew install pkg-config openssl
          echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl)" >> "$GITHUB_ENV"

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Regenerate checkout-local integrity manifest
        run: python3 tools/generate-sha256-manifest.py --root . --output security/sha256-manifest.json

      - name: Execute complete root build and wired test targets
        timeout-minutes: 120
        env:
          SLEELA_SHA256_MANIFEST: ${{ github.workspace }}/security/sha256-manifest.json
        run: make clean all

      - name: Verify root build products
        run: |
          test -x impl/build/sleela
          test -x impl/build/sleelvac
          test -x impl/build/nordshrift
          test -f impl/build/libslcore.a
          test -f registry/build/sleela.sleelareg
          test -f codecs/build/libsleela_codecs.a

  root-windows:
    name: Root make all (Windows 10+ / MinGW-w64)
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Set up MSYS2 UCRT64
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git
            make
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-python
            mingw-w64-ucrt-x86_64-openssl
            mingw-w64-ucrt-x86_64-pkgconf
            diffutils

      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Regenerate checkout-local integrity manifest
        run: python3 tools/generate-sha256-manifest.py --root . --output security/sha256-manifest.json

      - name: Execute complete root build and wired test targets
        timeout-minutes: 120
        env:
          SLEELA_SHA256_MANIFEST: ${{ github.workspace }}/security/sha256-manifest.json
        run: make clean all

      - name: Verify root build products
        run: |
          test -f impl/build/sleela.exe
          test -f impl/build/sleelvac.exe
          test -f impl/build/nordshrift.exe
          test -f registry/build/sleela.sleelareg

      - name: Exercise Windows guided installer in an isolated destination
        shell: pwsh
        timeout-minutes: 15
        run: |
          $destination = Join-Path $env:RUNNER_TEMP 'SLeeLa-Guided-Install'
          & ./install/sleela-clean-install.ps1 -NoBuild -Destination $destination
          if ($LASTEXITCODE -ne 0) { throw "Guided Windows installer failed: $LASTEXITCODE" }
          $sleela = Join-Path $destination 'bin/sleela.exe'
          $compiler = Join-Path $destination 'bin/sleelvac.exe'
          $catalog = Join-Path $destination 'bin/nordshrift.exe'
          foreach ($path in @($sleela,$compiler,$catalog)) {
            if (-not (Test-Path $path -PathType Leaf)) { throw "Missing installed product: $path" }
          }
          & $sleela version
          if ($LASTEXITCODE -ne 0) { throw "Installed Windows runtime smoke failed." }
          & $compiler --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Installed Windows compiler smoke failed." }
          Remove-Item -Recurse -Force $destination

  staged-install:
    name: Staged installers (${{ matrix.os }})
    needs: root-posix
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config python3 openjdk-21-jdk libssl-dev libx11-dev libxrandr-dev libfreetype-dev libfontconfig1-dev

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew install pkg-config openssl
          echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl)" >> "$GITHUB_ENV"

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Regenerate checkout-local integrity manifest and build products
        timeout-minutes: 120
        run: |
          python3 tools/generate-sha256-manifest.py --root . --output security/sha256-manifest.json
          make clean all

      - name: Stage user-local install, smoke products, and uninstall
        timeout-minutes: 20
        run: |
          set -eu
          prefix="$RUNNER_TEMP/sleela-user-prefix"
          stage="$RUNNER_TEMP/sleela-user-stage"
          make install-local PREFIX="$prefix" DESTDIR="$stage" SLEELA_MANIFEST_CONSENT=skip
          bindir="$stage$prefix/bin"
          test -x "$bindir/sleela"
          test -x "$bindir/sleelvac"
          test -x "$bindir/nordshrift"
          "$bindir/sleela" version
          "$bindir/sleelvac" --help >/dev/null
          "$bindir/nordshrift" objects >/dev/null
          make -C install uninstall PREFIX="$prefix" DESTDIR="$stage"
          test ! -e "$bindir/sleela"
          test ! -e "$bindir/sleelvac"
          test ! -e "$bindir/nordshrift"

      - name: Stage system install, smoke products, and uninstall
        timeout-minutes: 20
        run: |
          set -eu
          stage="$RUNNER_TEMP/sleela-system-stage"
          sudo make install-system PREFIX=/usr/local DESTDIR="$stage" SLEELA_MANIFEST_CONSENT=skip
          bindir="$stage/usr/local/bin"
          test -x "$bindir/sleela"
          test -x "$bindir/sleelvac"
          test -x "$bindir/nordshrift"
          "$bindir/sleela" version
          "$bindir/sleelvac" --help >/dev/null
          "$bindir/nordshrift" objects >/dev/null
          sudo make -C install uninstall PREFIX=/usr/local DESTDIR="$stage"
          test ! -e "$bindir/sleela"
          test ! -e "$bindir/sleelvac"
          test ! -e "$bindir/nordshrift"

      - name: Exercise guided installer in an isolated user prefix
        timeout-minutes: 20
        env:
          NO_COLOR: '1'
          SLEELA_MANIFEST_CONSENT: skip
          SLEELA_INSTALL_ROOT: ${{ runner.temp }}/sleela-guided-install
        run: |
          set -eu
          if [ "$RUNNER_OS" = "macOS" ]; then
            bash ./install/sleela-clean-install-macos.sh --plain </dev/null
          else
            bash ./install/sleela-clean-install.sh --plain </dev/null
          fi
          "$SLEELA_INSTALL_ROOT/bin/sleela" version
          "$SLEELA_INSTALL_ROOT/bin/sleelvac" --help >/dev/null
          rm -rf "$SLEELA_INSTALL_ROOT"

  install-all-sandbox:
    name: Full install-all / uninstall-all (${{ matrix.os }})
    needs: root-posix
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Linux native build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake pkg-config python3 openjdk-21-jdk libssl-dev libx11-dev libxrandr-dev libfreetype-dev libfontconfig1-dev

      - name: Install macOS native build dependencies
        if: runner.os == 'macOS'
        run: |
          brew install pkg-config openssl
          echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl)" >> "$GITHUB_ENV"

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build and refresh checkout integrity manifest
        timeout-minutes: 120
        run: |
          python3 tools/generate-sha256-manifest.py --root . --output security/sha256-manifest.json
          make clean all

      - name: Exercise all standard locations in the disposable hosted VM
        timeout-minutes: 40
        run: |
          set -eu
          sudo env SLEELA_WITH_TERMINAL=no SLEELA_MANIFEST_CONSENT=skip make install-all
          test -x "$HOME/.local/bin/sleela"
          test -x "$HOME/.local/sleela/bin/sleela"
          test -x /usr/local/bin/sleela
          "$HOME/.local/bin/sleela" version
          "$HOME/.local/sleela/bin/sleela" version
          /usr/local/bin/sleela version
          sudo make uninstall-all
          test ! -e "$HOME/.local/bin/sleela"
          test ! -e "$HOME/.local/sleela/bin/sleela"
          test ! -e /usr/local/bin/sleela
