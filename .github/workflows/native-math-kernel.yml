name: Native scalar math kernel C ABI

on:
  push:
    paths:
      - '.github/workflows/native-math-kernel.yml'
      - 'impl/subjects/math/math_kernel.hpp'
      - 'impl/subjects/math/sleela_math_kernel_c.h'
      - 'impl/subjects/math/sleela_math_kernel_c.cpp'
      - 'impl/tests/math_kernel_test.cpp'
  pull_request:
    paths:
      - '.github/workflows/native-math-kernel.yml'
      - 'impl/subjects/math/math_kernel.hpp'
      - 'impl/subjects/math/sleela_math_kernel_c.h'
      - 'impl/subjects/math/sleela_math_kernel_c.cpp'
      - 'impl/tests/math_kernel_test.cpp'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scalar-math:
    name: Scalar math kernel (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Compile and run scalar math kernel C ABI (POSIX)
        if: runner.os != 'Windows'
        run: |
          g++ -std=c++17 -O2 -Wall -Wextra -Iimpl/subjects/math impl/tests/math_kernel_test.cpp impl/subjects/math/sleela_math_kernel_c.cpp -o native-math-kernel-smoke
          ./native-math-kernel-smoke
      - name: Initialize MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Compile and run scalar math kernel C ABI (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cl /nologo /std:c++17 /O2 /W4 /Iimpl/subjects/math impl/tests/math_kernel_test.cpp impl/subjects/math/sleela_math_kernel_c.cpp /Fenative-math-kernel-smoke.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\native-math-kernel-smoke.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
