name: Temporary verified Java launcher validation

on:
  push:
    branches: [fix/java-launch-manifest-verification]

permissions:
  contents: write

jobs:
  regenerate-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: fix/java-launch-manifest-verification
          fetch-depth: 0

      - name: Install native build dependencies and Java
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential pkg-config python3 openjdk-21-jdk libx11-dev libfreetype-dev libfontconfig1-dev

      - name: Regenerate and check manifest
        run: |
          git diff --check
          python3 tools/generate-sha256-manifest.py --root . --output security/sha256-manifest.json
          ./scripts/regen-manifest.sh --check

      - name: Commit generated manifest to repair branch
        run: |
          if ! git diff --quiet -- security/sha256-manifest.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add security/sha256-manifest.json
            git commit -m "Regenerate SHA-256 manifest for Java process launcher"
            git push origin HEAD:fix/java-launch-manifest-verification
          else
            echo "Manifest already matches the source tree."
          fi

      - name: Build verified SLeeLa runtime
        env:
          SLEELA_SHA256_MANIFEST: ${{ github.workspace }}/security/sha256-manifest.json
        run: make -C impl clean all

      - name: Smoke test Java classpath, runnable JAR, argument forwarding, and exit status
        env:
          SLEELA_SHA256_MANIFEST: ${{ github.workspace }}/security/sha256-manifest.json
        shell: bash
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          trap 'rm -rf "$tmp"' EXIT
          mkdir -p "$tmp/src/smoke" "$tmp/classes"
          cat > "$tmp/src/smoke/Smoke.java" <<'JAVA'
          package smoke;
          public final class Smoke {
              public static void main(String[] args) {
                  if (args.length > 0 && args[0].equals("exit7")) System.exit(7);
                  for (String arg : args) System.out.println("ARG:" + arg);
              }
          }
          JAVA
          javac -d "$tmp/classes" "$tmp/src/smoke/Smoke.java"
          jar --create --file "$tmp/smoke.jar" --main-class smoke.Smoke -C "$tmp/classes" .

          class_output="$(./impl/build/sleela run --class-path "$tmp/classes" smoke.Smoke alpha "two words")"
          printf '%s\n' "$class_output"
          grep -Fx 'ARG:alpha' <<<"$class_output"
          grep -Fx 'ARG:two words' <<<"$class_output"

          jar_output="$(./impl/build/sleela run "$tmp/smoke.jar" alpha "two words")"
          printf '%s\n' "$jar_output"
          grep -Fx 'ARG:alpha' <<<"$jar_output"
          grep -Fx 'ARG:two words' <<<"$jar_output"

          set +e
          ./impl/build/sleela run --class-path "$tmp/classes" smoke.Smoke exit7
          class_status=$?
          ./impl/build/sleela run "$tmp/smoke.jar" exit7
          jar_status=$?
          set -e
          test "$class_status" -eq 7
          test "$jar_status" -eq 7
          echo "Java class/JAR launch smoke tests passed."
