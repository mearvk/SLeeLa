# web-server-technology/examples/envelopment.conf
#
# Example Side-2 envelopment: one domain fronts three disparate programs,
# each activated by a warrant for a cause. Side 2 is Scientist-gated, so it
# only activates when BOTH switches below are on (or passed on the command
# line as --envelopment --scientist).
#
# With envelopment off, the server ignores all of this and behaves as Side 1
# (a single program/meme per domain).

envelopment = on
scientist   = true
domain      = science.example

# --- Programs: named, mounted units of behaviour -------------------------

program     = landing
kind        = meme
mount       = /
meme-type   = text/html; charset=utf-8
meme-body   = <h1>science.example</h1><p>An envelopment of many programs.</p>

program     = papers
kind        = static
mount       = /papers
root        = ./papers

program     = lab
kind        = sql
mount       = /lab
db          = ./labdb
db-writable = false

# --- Warrants: a cause, served for a subject, by a program ---------------
# First enabled warrant whose subject and path match wins (declaration order).

warrant     = publish-landing-page
subject     = science.example
path        = /
use         = landing
enabled     = true

warrant     = serve-peer-reviewed-papers
subject     = science.example
path        = /papers
use         = papers
enabled     = true

warrant     = expose-lab-dataset-readonly
subject     = science.example
path        = /lab
use         = lab
enabled     = true
