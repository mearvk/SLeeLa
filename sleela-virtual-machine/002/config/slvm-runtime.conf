# SLVM/2 runtime selection
vm.instance = 2
runtime.target = auto
runtime.adapter = auto
runtime.mode = native
security.profile = secure-default
crypto.provider = platform
crypto.required = true
link.policy = signed
link.allow_unsigned = false
observer.mode = audit
observer.redact_secrets = true
certificate.policy = required
certificate.trust_store = platform
attestation.mode = available
compliance.profile = baseline
broker.require_encryption = true
broker.require_peer_identity = true
memory.limit = 536870912
