name: Rebuild BANKS2 Complete Table

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rebuild-banks2
  cancel-in-progress: true

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Rebuild complete BANKS2 table
        run: python3 tools/banking/merge_bank_currency_to_banks2.py

      - name: Commit BANKS2
        run: |
          git config user.name "SLeeLa BANKS2 Workflow"
          git config user.email "actions@users.noreply.github.com"
          git add BANKS2.md
          if git diff --cached --quiet; then
            echo "BANKS2.md already current."
          else
            git commit -m "Update BANKS2 with complete original columns and currency"
            git push
          fi
