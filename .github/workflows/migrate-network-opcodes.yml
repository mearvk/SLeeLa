name: Migrate Network Opcodes

on:
  push:
    branches: [master]
    paths:
      - 'tools/migrate-network-opcodes.py'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Apply migration
        run: python3 tools/migrate-network-opcodes.py

      - name: Commit migration
        run: |
          if git diff --quiet -- impl/core/sleela_core.c; then
            echo 'Network opcode migration already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add impl/core/sleela_core.c
          git commit -m 'Route VM networking through OS-aware network layer'
          git push origin HEAD:master
