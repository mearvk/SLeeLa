name: SLeeLa GUI Theme CI

on:
  push:
    branches: [master, main]
    paths:
      - 'gui/native/**'
      - 'gui/config/gui-theme.json'
      - 'lib/gui/**'
      - '.github/workflows/gui-theme-ci.yml'
  pull_request:
    paths:
      - 'gui/native/**'
      - 'gui/config/gui-theme.json'
      - 'lib/gui/**'
      - '.github/workflows/gui-theme-ci.yml'
  workflow_dispatch:

jobs:
  native-theme:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate static theme configuration
        run: python -c "import json; d=json.load(open('gui/config/gui-theme.json', encoding='utf-8')); assert d['required']['title-bar']=='#1D2025'; assert d['required']['url-bar']=='#383C47'; assert len(d['appliesTo'])==5"
      - name: Configure native theme tests
        run: cmake -S gui/native -B build/gui-native
      - name: Build native bridge and theme tests
        run: cmake --build build/gui-native --config Release
      - name: Run native bridge and theme tests
        run: ctest --test-dir build/gui-native -C Release --output-on-failure
