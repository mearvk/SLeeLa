name: Refresh BANKS Synchronized

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: banks-synchronized-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out current master
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: master

      - name: Synchronize with origin/master
        run: |
          git fetch origin master
          git reset --hard origin/master

      - name: Validate Python
        run: python3 --version

      - name: Generate canonical 391-country registry
        run: |
          python3 tools/banking/generate_registry.py \
            --source http/spec/COUNTRY_NETWORK_ENCLOSURE.md \
            --fallback http/spec/BYPASS.md \
            --output data/banking/registry.json

      - name: Validate registry
        run: |
          python3 - <<'PY'
          import json
          with open("data/banking/registry.json", encoding="utf-8") as f:
              data = json.load(f)
          assert data["expected_count"] == 391
          assert len(data["countries"]) == 391
          assert [row["registry_id"] for row in data["countries"]] == [f"{i:03d}" for i in range(1, 392)]
          print("391-country registry invariant: PASS")
          PY

      - name: Generate national banking and economic data
        run: |
          python3 .github/workflows/populate_banks.py \
            --registry data/banking/registry.json \
            --output data/banking/national_banking.json \
            --table BANKS.md

      - name: Validate national data
        run: |
          python3 - <<'PY'
          import json
          with open("data/banking/national_banking.json", encoding="utf-8") as f:
              data = json.load(f)
          assert data["expected"] == 391
          assert len(data["records"]) == 391
          assert data.get("coverage", {}).get("total") == 391
          print("391-country banking invariant: PASS")
          print("Coverage:", data.get("coverage", {}))
          PY

      - name: Commit and push synchronized result
        run: |
          git config user.name "SLeeLa BANKS Synchronized Workflow"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BANKS.md data/banking/registry.json data/banking/national_banking.json
          if git diff --cached --quiet; then
            echo "No generated changes."
            exit 0
          fi
          git commit -m "Refresh synchronized national banking and economic data"
          git fetch origin master
          git rebase origin/master
          git push origin HEAD:master
