name: Populate National Banking and Economic Data

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: write

jobs:
  populate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Python
        run: python3 --version

      - name: Populate national records
        run: |
          python3 tools/banking/populate_banks.py             --registry data/banking/registry.json             --output data/banking/national_banking.json             --table BANKS.md

      - name: Validate 391-record invariant
        run: |
          python3 - <<'PY'
          import json
          p = json.load(open("data/banking/national_banking.json", encoding="utf-8"))
          assert p["expected"] == 391
          assert len(p["records"]) == 391
          print("391-country invariant: PASS")
          PY

      - name: Commit generated data
        run: |
          git config user.name "SLeeLa Data Workflow"
          git config user.email "actions@users.noreply.github.com"
          git add BANKS.md data/banking/national_banking.json
          git diff --cached --quiet || git commit -m "Refresh national banking and economic data"
          git push
