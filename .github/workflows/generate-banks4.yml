name: Generate BANKS4 Banking Column

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: write

concurrency:
  group: generate-banks4
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Generate BANKS3 (input to BANKS4)
        # BANKS3.md is a derived join of BANKS.md + BANKS2.md and is not
        # committed, so regenerate it here before deriving BANKS4. This makes
        # the workflow self-sufficient rather than depending on a separate
        # Generate-BANKS3 run having landed first.
        run: python3 tools/banking/generate_banks3.py

      - name: Generate BANKS4 from BANKS3
        run: python3 tools/banking/update_banks4.py

      - name: Validate 391 entries and preserved columns
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          source = Path('BANKS3.md').read_text(encoding='utf-8')
          output = Path('BANKS4.md').read_text(encoding='utf-8')
          pat = re.compile(r'^\| (\d{3}) \| (.*?) \| (.*?) \| (.*?) \| (.*?) \| (.*?) \| (.*?) \| (.*?) \| (.*?) \| (.*?) \| (.*?) \|$', re.M)
          a = pat.findall(source)
          b = pat.findall(output)
          assert len(a) == 391, len(a)
          assert len(b) == 391, len(b)
          for old, new in zip(a, b):
              assert old[:9] == new[:9], (old[0], old[:9], new[:9])
              assert new[9] != 'PENDING', new
              assert old[10] == new[10], (old[0], old[10], new[10])
          assert [r[0] for r in b] == [f'{i:03d}' for i in range(1, 392)]
          print('BANKS4 validation: 391 rows, all non-Banking columns preserved, Banking updated.')
          PY

      - name: Commit BANKS4
        run: |
          git config user.name "SLeeLa Data Workflow"
          git config user.email "actions@users.noreply.github.com"
          git add BANKS4.md
          if git diff --cached --quiet; then
            echo "BANKS4 already current."
          else
            git commit -m "Generate BANKS4 with updated Banking column"
            git push
          fi
