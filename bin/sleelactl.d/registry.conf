# =============================================================================
# sleelactl module registry — the single source of truth that maps each SLeeLa
# module to its NATURE. sleelactl reads this to decide which verbs are legal for
# a module, because the families are genuinely different kinds of thing and the
# same verb must not be forced onto all of them (see lib/core/SERVICE-STANDARD.md:
# "a worse abstraction forced onto a subsystem is worse than a little duplication").
#
# Format (one module per line; '#' starts a comment; blank lines ignored):
#
#   <name>  <nature>  <handle>  <summary>
#
#   name     the module identifier used on the command line.
#   nature   one of: daemon | registry | datasource | protocol | tool | library
#   handle   nature-specific target:
#              daemon      -> the systemd unit name (no path)
#              registry    -> the lib/ package whose SLeeLa Controller it drives
#              datasource  -> the lib/ package whose SLDataSource surface it drives
#              protocol    -> the module directory (spec/stack/sim lives there)
#              tool        -> the module directory (built CLI lives there)
#              library     -> the lib/ package (no runtime control; info only)
#   summary  short human description.
#
# The legal verbs per nature (enforced by sleelactl):
#   daemon      start stop restart reload status enable disable
#   registry    load unload enable disable list probe can status
#   datasource  open close status available
#   protocol    negotiate grade simulate validate info
#   tool        run build inspect info
#   library     info
#
# This file is intentionally data, not code: new modules are added by appending
# a line, never by editing the dispatcher.
# =============================================================================

# ---- daemons: genuine long-lived processes with systemd units ---------------
server-edition   daemon      sleela-server.service       Bounded transport + packet-admission server (sleelas/serverd)
server-edition3  daemon      sleela-server3.service      Server edition, moral tier 3 (serverd)
antivirus        daemon      sleela-antivirus.service    Antivirus coordinator (sleelavirin scan engine)

# ---- registries: closed handler sets with load/unload/enable (SLPluginService)
codecs           registry    codecs        Audio codec registry (20 handlers; load/unload/probe)
compression      registry    compression   Compression registry (15 handlers; native 0-3)
video            registry    video         Video codec registry (12 handlers)

# ---- data systems: open/close/active + connection pooling (SLDataSource) ----
database         datasource  database      SQL data sources + connection pool (open/close/active)
db-connector     datasource  db-connector  Native database connector driver
sleela-sql       datasource  sleela-sql    SLeeLa SQL dialect/engine
ledger           datasource  ledger        Append-only ledger store
registry-store   datasource  registry      Native object/subject registry store

# ---- protocols: specs / stacks / reference models (negotiate/simulate) ------
http-1.0         protocol    http-1.0      HTTP/1.0 protocol metadata generation
http-2.0         protocol    http-2.0      HTTP/2.0 protocol metadata generation
http-3.0         protocol    http-3.0      HTTP/3.0 protocol metadata generation
http-4.0         protocol    http-4.0      HTTP/4.0 protocol metadata generation
http-5.0         protocol    http-5.0      HTTP/5.0 protocol metadata generation
http-6.0         protocol    http-6.0      HTTP/6.0 protocol metadata generation
http-7.0         protocol    http-7.0      HTTP/7.0 protocol metadata generation
http-8.0         protocol    http-8.0      HTTP/8.0 protocol metadata generation
http-9.0         protocol    http-9.0      HTTP/9.0 experimental protocol generation (not IETF)
cdma             protocol    cdma          CDMA reference models + simulator (cdma-sim)
ofdma            protocol    ofdma         OFDMA channelization models
wifi-common      protocol    wifi-common   Shared Wi-Fi contracts
wi-fi-4          protocol    wi-fi-4       Wi-Fi 4 (802.11n) model
wi-fi-5          protocol    wi-fi-5       Wi-Fi 5 (802.11ac) model
wi-fi-6          protocol    wi-fi-6       Wi-Fi 6 (802.11ax) model
telephony-skya   protocol    telephony-skya  Skya telephony stack
resolver         protocol    resolver      Shared target-validation resolver (resolve/validate)
route            protocol    route         Shared route-data contract (ROUTE.DATA.json)
connector        protocol    connector     Native data-source / transport connector
preferred-routers protocol   preferred-routers  Preferred-router selection model

# ---- tools: on-demand, one-shot toolchain components ------------------------
compiler         tool        compiler      SLeeLa compiler toolchain component
decompiler       tool        decompiler    Slecompiler native-binary analysis/decompilation CLI
debugger         tool        debugger      SLeeLa debugger
