name: Synchro Suite
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
jobs:
  synchro:
    name: Synchro C/C++/Java
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          cc --version
          c++ --version
          javac -version
          java -version
      - run: bash synchro/tests/run_synchro_suite.sh
