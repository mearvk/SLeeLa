<body><h1>SLeeLa SMTP Transport</h1><h2>Sequence</h2><ol><li>Connect</li><li>EHLO</li><li>STARTTLS or implicit TLS</li><li>Optional AUTH PLAIN</li><li>MAIL FROM</li><li>RCPT TO</li><li>DATA</li><li>QUIT</li></ol>
