# SLeeLa VM selection template
# Valid generations: 1 through 11; default generation is 11.
# Precedence: explicit launcher/CLI, SLEELA_VM_VERSION, selected vm.conf, compiled default.
vm.version = 11
# user | administrator | developer
vm.profile = user
# Reject invalid requested versions; launcher separately checks availability.
vm.strict = true
# Pin the VM generation above: when true, the CLI uses vm.version and refuses
# any other requested generation. Opt in with `sleela vm lock [premium <n>]`
# (defaults to the highest/advanced generation) and clear with `sleela vm unlock`.
vm.locked = false

# Java interoperability is an optional external-runtime capability, not a
# property implied by the selected SLeeLa VM generation.
java.mode = external
java.enabled = true
java.executable = auto
java.classpath = .
javafx.module_path =
javafx.modules = javafx.controls,javafx.graphics
java.headless = auto
# Supported values: external | embedded | disabled.
# "embedded" is reserved until an opt-in JNI implementation is built and tested.
