name: mt-check

# Verifies the MT metalayers on every push and pull request:
#   * MT-META-0001 — metatag markers are legal and canonically ordered
#   * MT-SEAL-0001 — every sealed document still matches its solve matrix
# Both checks are passwordless, so no secrets are needed in CI.

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  mt-check:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run MT metalayer checks (metatag scan + seal audit)
        run: sh impl/ci/mt-check.sh
