# SLeeLa Language Settings
# Max Rupplin - MEARVK LLC - 2026
#
# Chooses the language SLeeLa uses to present its outputs and prompts. This is
# the single place a user/administrator records a localization preference; the
# lib/languages library (SLLanguageSettings / SLLanguageCatalog) reads it so a
# chosen language persists and becomes the default without touching program
# logic. SLeeLa decides what to say; these settings decide the language it is
# said in.

[language]
# Active locale: a BCP-47 code present in this folder. One of:
#   en es fr de pt it ja zh hi ko th ar
# Change this one line to switch the language of all localized output.
active = "en"

# Fallback locale used when a key is missing from the active pack, or when the
# active code is unknown. English is the reference pack and the safe default.
fallback = "en"

# Where packs are discovered. mode=folder resolves relative to this file's
# directory; mode=absolute uses absolute_path. Pack files are <code>.lang.
mode = "folder"
relative_path = "."
absolute_path = ""

[format]
# Honor a pack's declared script direction (#!direction = ltr|rtl). When true,
# a front end should lay out right-to-left locales (ar) accordingly.
respect_direction = true

# Fill {0}, {1}, ... placeholders in messages with caller-supplied values.
enable_placeholders = true

# When a requested key is absent from both the active and fallback packs,
# missing_key=key echoes the key itself; missing_key=empty yields an empty
# string. "key" is the safe, debuggable default.
missing_key = "key"

[override]
# Optional environment-variable override. When set and non-empty, the value of
# this variable wins over [language].active for the current run.
env_var = "SLEELA_LANG"
