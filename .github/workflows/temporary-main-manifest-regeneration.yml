name: Temporary main-branch manifest regeneration

on:
  push:
    branches: [fix/java-launcher-main-sync]

permissions:
  contents: write

jobs:
  regenerate-manifest:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out current main-sync branch
        uses: actions/checkout@v4
        with:
          ref: fix/java-launcher-main-sync
          fetch-depth: 0
      - name: Regenerate and verify manifest
        run: |
          python3 tools/generate-sha256-manifest.py --root . --output security/sha256-manifest.json
          ./scripts/regen-manifest.sh --check
      - name: Commit generated manifest
        run: |
          if ! git diff --quiet -- security/sha256-manifest.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add security/sha256-manifest.json
            git commit -m "Regenerate SHA-256 manifest for main Java launcher sync"
            git fetch origin fix/java-launcher-main-sync
            git rebase origin/fix/java-launcher-main-sync
            git push origin HEAD:fix/java-launcher-main-sync
          else
            echo "Manifest already matches the source tree."
          fi
