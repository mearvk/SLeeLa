<svg xmlns="http://www.w3.org/2000/svg" width="600" height="78" viewBox="0 0 600 78" role="img" aria-label="Greek Hellenic color palette">
  <title>Greek Hellenic palette: #0A1A30, #FFFFFF, #2E7BD6, #5E9FE0, #9FC3EC, #6E86A6</title>
  <defs><clipPath id="rounded"><rect width="600" height="48" rx="9" ry="9"/></clipPath></defs>
  <g clip-path="url(#rounded)">
  <rect x="0" y="0" width="100" height="48" fill="#0A1A30"/><rect x="100" y="0" width="100" height="48" fill="#FFFFFF"/>
  <rect x="200" y="0" width="100" height="48" fill="#2E7BD6"/><rect x="300" y="0" width="100" height="48" fill="#5E9FE0"/>
  <rect x="400" y="0" width="100" height="48" fill="#9FC3EC"/><rect x="500" y="0" width="100" height="48" fill="#6E86A6"/>
  </g>
  <text x="50" y="69" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#4B5563">Background</text><text x="150" y="69" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#4B5563">Foreground</text>
  <text x="250" y="69" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#4B5563">Keywords</text><text x="350" y="69" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#4B5563">Types</text>
  <text x="450" y="69" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#4B5563">Strings</text><text x="550" y="69" text-anchor="middle" font-family="Arial, sans-serif" font-size="10" fill="#4B5563">Comments</text>
</svg>