name: Native Drive

on:
  push:
    paths:
      - '.github/workflows/native-drive.yml'
      - 'impl/native-drive/**'
      - 'impl/tests/native_drive/**'
      - 'tools/tests/test_native_drive.py'
      - 'os-level-support/loader/native_loader.h'
      - 'os-level-support/loader/tests/**'
      - 'security/sha256-manifest.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-drive:
    name: Native Drive (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify trusted source manifest
        run: python tools/verify-before-execution.py --manifest security/sha256-manifest.json --root .
      - name: Compile VM-owned native module lifecycle bridge
        if: runner.os != 'Windows'
        run: make -C impl build/native_loader.o build/native_module_table.o build/sleela_core.o
      - name: Check installer inputs
        if: runner.os != 'Windows'
        run: make -C install install-check
      - name: Check POSIX installer syntax
        if: runner.os != 'Windows'
        run: |
          sh -n bin/sleelactl
          bash -n install/quick-safe-install.sh
      - name: Check Windows installer syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path "install/quick-safe-install.ps1"), [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -gt 0) { $errors | Format-List; exit 1 }
      - name: Run Native Drive tests
        run: python -m unittest discover -s tools/tests -p "test_native_drive.py" -v
      - name: Compile and run Native IPC codec smoke test (POSIX)
        if: runner.os != 'Windows'
        run: |
          mkdir -p build
          cc -std=c11 -Wall -Wextra -Werror impl/tests/native_drive/native_ipc_protocol_smoke.c -o build/native-ipc-protocol-smoke
          ./build/native-ipc-protocol-smoke
      - name: Initialize MSVC environment
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
      - name: Compile and run Native IPC codec smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build | Out-Null
          cl /nologo /std:c11 /W4 impl/tests/native_drive/native_ipc_protocol_smoke.c /Febuild/native-ipc-protocol-smoke.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          .\build\native-ipc-protocol-smoke.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Configure native loader ABI tests
        run: cmake -S os-level-support -B build/native-loader -DBUILD_TESTING=ON
      - name: Build native loader ABI tests
        run: cmake --build build/native-loader --config Release
      - name: Run native loader ABI tests
        run: ctest --test-dir build/native-loader -C Release --output-on-failure
