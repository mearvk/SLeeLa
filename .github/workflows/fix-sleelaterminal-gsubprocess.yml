name: Fix SleelaTerminal GSubprocess GTK4 types

on:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[skip ci]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix GTK4/GIO C++ type conversions
        run: |
          python3 <<'PY'
          from pathlib import Path
          path = Path('sleela-terminal/sleelaterminal-gui.cpp')
          s = path.read_text()

          old_flags = 'G_SUBPROCESS_FLAGS_STDOUT_PIPE | G_SUBPROCESS_FLAGS_STDERR_PIPE'
          new_flags = 'static_cast<GSubprocessFlags>(G_SUBPROCESS_FLAGS_STDOUT_PIPE | G_SUBPROCESS_FLAGS_STDERR_PIPE)'
          if old_flags in s and new_flags not in s:
              s = s.replace(old_flags, new_flags, 1)

          old_error = '''        if (error) g_error_free(error); return;'''
          new_error = '''        if (error) {
            g_error_free(error);
        }
        return;'''
          if old_error in s:
              s = s.replace(old_error, new_error, 1)

          old_notify = '''        }), payload, [](gpointer data) { delete static_cast<Payload *>(data); }, G_CONNECT_AFTER);'''
          new_notify = '''        }), payload, [](gpointer data, GClosure *) {
            delete static_cast<Payload *>(data);
        }, G_CONNECT_AFTER);'''
          if old_notify in s:
              s = s.replace(old_notify, new_notify, 1)

          path.write_text(s)
          PY

          git diff --check
          git diff -- sleela-terminal/sleelaterminal-gui.cpp

          if git diff --quiet; then
            echo 'No changes required.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sleela-terminal/sleelaterminal-gui.cpp
          git commit -m 'Fix SleelaTerminal GSubprocess GTK4 type conversions [skip ci]'
          git push

          rm -f .github/workflows/fix-sleelaterminal-gsubprocess.yml
          git add -u .github/workflows/fix-sleelaterminal-gsubprocess.yml
          git commit -m 'Remove one-shot SleelaTerminal build fix workflow [skip ci]'
          git push
