group=com.mearvk.sleela
version=0.3.0-dev

# IntelliJ Platform target. IC = IntelliJ IDEA Community.
# Pin a concrete published patch version: the bare "2026.1" coordinate is not
# resolvable in the IntelliJ Platform Maven repository ("Could not find
# idea:ideaIC:2026.1"); released patch builds like 2026.1.3 are. If this exact
# patch is unavailable, set it to another published 2026.1.x (e.g. 2026.1.1/.2).
platformType=IC
platformVersion=2026.1.3

# Supported IDE build range for the published plugin.
pluginSinceBuild=261
pluginUntilBuild=261.*

# Gradle / configuration cache
org.gradle.configuration-cache=true
org.gradle.caching=true
kotlin.stdlib.default.dependency=false
