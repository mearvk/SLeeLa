name: Sleelavirin Antivirus Binary Builds

on:
  push:
    branches: [main, master]
    tags: ["v*"]
    paths:
      - "antivirus/**"
      - ".github/workflows/antivirus-binaries.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "antivirus/**"
      - ".github/workflows/antivirus-binaries.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: write
    name: Build standalone binaries (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x86_64
            archive: sleelavirin-linux-x86_64.zip
          - os: windows-latest
            platform: windows-x86_64
            archive: sleelavirin-windows-x86_64.zip
          - os: macos-14
            platform: macos-arm64
            archive: sleelavirin-macos-arm64.zip
          - os: macos-15-intel
            platform: macos-x86_64
            archive: sleelavirin-macos-x86_64.zip
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install PyInstaller
        run: python -m pip install --disable-pip-version-check pyinstaller
      - name: Set up Windows native compiler
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: make mingw-w64-ucrt-x86_64-gcc
      - name: Build and test native scanner (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          make -C antivirus clean
          make -C antivirus test
          mkdir -p antivirus/dist/signatures
          cp antivirus/signatures/native-sha256.txt antivirus/dist/signatures/
          cp antivirus/build/sleelavirin-scan antivirus/dist/sleelavirin-native
      - name: Build and test native scanner (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          make -C antivirus clean
          make -C antivirus test
          mkdir -p antivirus/dist/signatures
          cp antivirus/signatures/native-sha256.txt antivirus/dist/signatures/
          cp antivirus/build/sleelavirin-scan.exe antivirus/dist/sleelavirin-native.exe
      - name: Build standalone Python executables (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --name sleelavirin-scan antivirus/tools/sleelavirin_scan.py
          python -m PyInstaller --noconfirm --clean --onefile --name sleelavirin-update-clamav antivirus/tools/sleelavirin_update_clamav.py
          python -m PyInstaller --noconfirm --clean --onefile --name sleelavirin-import-clamav antivirus/tools/sleelavirin_import_clamav.py
          python -m PyInstaller --noconfirm --clean --onefile --name sleelavirin-clamav antivirus/tools/sleelavirin_clamav.py
          python -m PyInstaller --noconfirm --clean --onefile --name sleelavirin-verify-signature antivirus/tools/sleelavirin_verify_signature.py
          cp dist/sleelavirin-scan antivirus/dist/
          cp dist/sleelavirin-update-clamav antivirus/dist/
          cp dist/sleelavirin-import-clamav antivirus/dist/
          cp dist/sleelavirin-clamav antivirus/dist/
          cp dist/sleelavirin-verify-signature antivirus/dist/
      - name: Build standalone Python executables (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --name sleelavirin-scan antivirus/tools/sleelavirin_scan.py
          python -m PyInstaller --noconfirm --clean --onefile --name sleelavirin-update-clamav antivirus/tools/sleelavirin_update_clamav.py
          python -m PyInstaller --noconfirm --clean --onefile --name sleelavirin-import-clamav antivirus/tools/sleelavirin_import_clamav.py
          python -m PyInstaller --noconfirm --clean --onefile --name sleelavirin-verify-signature antivirus/tools/sleelavirin_verify_signature.py
          Copy-Item dist/sleelavirin-scan.exe antivirus/dist/
          Copy-Item dist/sleelavirin-update-clamav.exe antivirus/dist/
          Copy-Item dist/sleelavirin-import-clamav.exe antivirus/dist/
          Copy-Item dist/sleelavirin-clamav.exe antivirus/dist/
          Copy-Item dist/sleelavirin-verify-signature.exe antivirus/dist/
      - name: Smoke-test packaged executables (Linux/macOS)
        if: runner.os != 'Windows'
        run: |
          chmod +x antivirus/dist/sleelavirin-*
          antivirus/dist/sleelavirin-scan --help
          antivirus/dist/sleelavirin-update-clamav --help
          antivirus/dist/sleelavirin-import-clamav --help
          antivirus/dist/sleelavirin-clamav --help
          antivirus/dist/sleelavirin-verify-signature --help
          antivirus/dist/sleelavirin-native --help
      - name: Smoke-test packaged executables (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          antivirus/dist/sleelavirin-scan.exe --help
          antivirus/dist/sleelavirin-update-clamav.exe --help
          antivirus/dist/sleelavirin-import-clamav.exe --help
          antivirus/dist/sleelavirin-clamav.exe --help
          antivirus/dist/sleelavirin-verify-signature.exe --help
          antivirus/dist/sleelavirin-native.exe --help
      - name: Write checksums and package release archive
        shell: python
        run: |
          from pathlib import Path
          import hashlib
          import zipfile
          root = Path("antivirus/dist")
          lines = []
          for path in sorted(p for p in root.rglob("*") if p.is_file()):
              if path.name == "SHA256SUMS":
                  continue
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              lines.append(f"{digest}  {path.relative_to(root).as_posix()}")
          (root / "SHA256SUMS").write_text("\n".join(lines) + "\n", encoding="utf-8")
          archive = Path("${{ matrix.archive }}")
          with zipfile.ZipFile(archive, "w", zipfile.ZIP_DEFLATED) as zf:
              for path in sorted(p for p in root.rglob("*") if p.is_file()):
                  zf.write(path, Path("sleelavirin") / path.relative_to(root))
      - uses: actions/upload-artifact@v4
        with:
          name: sleelavirin-${{ matrix.platform }}
          path: ${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 30
      - name: Publish tagged release asset
        if: startsWith(github.ref, 'refs/tags/v') && github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.archive }}
