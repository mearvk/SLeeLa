name: Native Compiler CI
on:
  push:
    branches: [main, master]
    paths:
      - 'compiler/**'
      - 'lib/compiler/**'
      - '.github/workflows/native-compiler.yml'
  pull_request:
    paths:
      - 'compiler/**'
      - 'lib/compiler/**'
      - '.github/workflows/native-compiler.yml'
  workflow_dispatch:
jobs:
  native-compiler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S compiler -B build/compiler -DSLEELA_COMPILER_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build/compiler --parallel 2
      - name: Unit tests
        run: ctest --test-dir build/compiler --output-on-failure
      - name: Validate example
        run: build/compiler/sleelac --check compiler/examples/arithmetic.sleela
      - name: Inspect bytecode
        run: build/compiler/sleelac --emit-ir compiler/examples/arithmetic.sleela
      - name: Run example
        run: build/compiler/sleelac --run compiler/examples/arithmetic.sleela
      - name: Emit native C and C++
        run: |
          build/compiler/sleelac --emit-c build/compiler/arithmetic.c compiler/examples/arithmetic.sleela
          build/compiler/sleelac --emit-cpp build/compiler/arithmetic.cpp compiler/examples/arithmetic.sleela
      - name: Compile generated native sources
        run: |
          cc -std=c11 -Wall -Wextra -Werror build/compiler/arithmetic.c -o build/compiler/arithmetic-c
          c++ -std=c++20 -Wall -Wextra -Werror build/compiler/arithmetic.cpp -o build/compiler/arithmetic-cpp
      - name: Execute generated native programs
        run: |
          test "$(build/compiler/arithmetic-c)" = "42"
          test "$(build/compiler/arithmetic-cpp)" = "42"
