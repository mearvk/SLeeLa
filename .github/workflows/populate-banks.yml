name: Populate National Banking and Economic Data

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: write

jobs:
  populate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Python
        run: python3 --version

      - name: Run national banking population script
        run: |
          python3 .github/workflows/populate_banks.py \
            --registry data/banking/registry.json \
            --output data/banking/national_banking.json \
            --table BANKS.md

      - name: Validate 391-country invariant
        run: |
          python3 - <<'PY'
          import json
          with open("data/banking/national_banking.json", encoding="utf-8") as f:
              data = json.load(f)
          assert data["expected"] == 391
          assert len(data["records"]) == 391
          print("391-country invariant: PASS")
          PY

      - name: Commit generated records
        run: |
          git config user.name "SLeeLa Data Workflow"
          git config user.email "actions@users.noreply.github.com"
          git add BANKS.md data/banking/national_banking.json
          if git diff --cached --quiet; then
            echo "No generated changes."
          else
            git commit -m "Refresh national banking and economic data"
            git push
          fi
