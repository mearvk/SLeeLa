name: SLeeLa Terminal M5

on:
  push:
    paths:
      - 'sleela-terminal/**'
      - '.github/workflows/sleela-terminal-m5.yml'
  pull_request:
    paths:
      - 'sleela-terminal/**'
      - '.github/workflows/sleela-terminal-m5.yml'

permissions:
  contents: read

jobs:
  core-build-and-test:
    name: Core build and tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    defaults:
      run:
        working-directory: sleela-terminal
    steps:
      - uses: actions/checkout@v4
      - name: Build core shell without optional GUI dependencies
        run: make clean all
      - name: Full smoke suite
        run: make test

  linux-hardening:
    name: Linux sanitizer and fuzz checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sleela-terminal
    steps:
      - uses: actions/checkout@v4
      - name: Sanitizer validation
        run: make sanitize
      - name: Install Clang
        run: sudo apt-get update && sudo apt-get install -y clang
      - name: Build fuzz target
        run: make fuzz

  linux-gui-build:
    name: Optional GTK4/VTE GUI build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sleela-terminal
    steps:
      - uses: actions/checkout@v4
      - name: Install GTK4 and VTE development packages
        run: sudo apt-get update && sudo apt-get install -y libgtk-4-dev libvte-2.91-gtk4-dev
      - name: Build GUI explicitly
        run: make clean all-gui
