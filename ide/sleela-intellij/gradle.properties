group=com.mearvk.sleela
version=0.3.0-dev

# IntelliJ Platform target (IntelliJ IDEA Community).
# Must be a published IntelliJ Platform build. 2025.3.6.1 is the version shipped
# by the official JetBrains plugin template, so it is guaranteed to resolve.
# platformType is retained for documentation; the dependency uses intellijIdea().
platformType=IC
platformVersion=2025.3.6.1

# Supported IDE build range for the published plugin. 2025.3 line = build 253.
pluginSinceBuild=253
pluginUntilBuild=253.*

# Gradle / configuration cache
org.gradle.configuration-cache=true
org.gradle.caching=true
kotlin.stdlib.default.dependency=false
