name: SLeeLa Audio Native and GUI
on:
  push:
    paths: ['audio/native/**','audio/gui/**','.github/workflows/audio-gui.yml']
  pull_request:
    paths: ['audio/native/**','audio/gui/**','.github/workflows/audio-gui.yml']
  workflow_dispatch:
jobs:
  native:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: audio/native } }
    steps:
      - uses: actions/checkout@v4
      - run: make clean all test
  java:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: audio/gui } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: maven }
      - run: mvn --batch-mode --no-transfer-progress clean test
