name: LLM Vocabulary + Reasoning

on:
  push:
    branches: [master, main]
    paths:
      - "artificial-intelligence/large-language-models/tokenizers/**"
      - "artificial-intelligence/large-language-models/vocabulary/**"
      - "artificial-intelligence/large-language-models/tools/**"
      - "artificial-intelligence/large-language-models/large_language_models_base_vocabulary.*"
      - "artificial-intelligence/large-language-models/large_language_models_vocabulary.*"
      - "artificial-intelligence/large-language-models/large_language_models_reasoning.*"
      - "artificial-intelligence/large-language-models/large_language_models.*"
      - "artificial-intelligence/large-language-models/reasoning/**"
      - "artificial-intelligence/large-language-models/REASONING.md"
      - "artificial-intelligence/large-language-models/large_language_models_capacity.*"
      - "artificial-intelligence/large-language-models/models/capacity-profile*"
      - "artificial-intelligence/large-language-models/large_language_models_code.*"
      - "artificial-intelligence/large-language-models/models/code-model*"
      - "artificial-intelligence/large-language-models/sleela/**"
      - "artificial-intelligence/large-language-models/parametry/**"
      - "artificial-intelligence/neural-nets/**"
      - "artificial-intelligence/large-language-models/loader/**"
      - "artificial-intelligence/rrs/**"
      - ".github/workflows/llm-vocabulary.yml"
  pull_request:
    branches: [master, main]
    paths:
      - "artificial-intelligence/large-language-models/tokenizers/**"
      - "artificial-intelligence/large-language-models/vocabulary/**"
      - "artificial-intelligence/large-language-models/tools/**"
      - "artificial-intelligence/large-language-models/large_language_models_base_vocabulary.*"
      - "artificial-intelligence/large-language-models/large_language_models_vocabulary.*"
      - "artificial-intelligence/large-language-models/large_language_models_reasoning.*"
      - "artificial-intelligence/large-language-models/large_language_models.*"
      - "artificial-intelligence/large-language-models/reasoning/**"
      - "artificial-intelligence/large-language-models/REASONING.md"
      - "artificial-intelligence/large-language-models/large_language_models_capacity.*"
      - "artificial-intelligence/large-language-models/models/capacity-profile*"
      - "artificial-intelligence/large-language-models/large_language_models_code.*"
      - "artificial-intelligence/large-language-models/models/code-model*"
      - "artificial-intelligence/large-language-models/sleela/**"
      - "artificial-intelligence/large-language-models/parametry/**"
      - "artificial-intelligence/neural-nets/**"
      - "artificial-intelligence/large-language-models/loader/**"
      - "artificial-intelligence/rrs/**"
      - ".github/workflows/llm-vocabulary.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gate:
    name: Validate word sets + build + seed self-test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: artificial-intelligence/large-language-models
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install jsonschema (full schema checks)
        run: python -m pip install --quiet jsonschema

      - name: Validation / licensing gate
        run: python3 tools/validate_vocabulary.py

      - name: Build vocabulary from base + corpus (strict)
        run: >-
          python3 tools/build_vocabulary.py
          --base tokenizers/base-vocabulary.json
          --corpus vocabulary/corpus/core-en.jsonl
          --out /tmp/built-vocab.txt
          --report /tmp/build-report.json
          --strict

      - name: Compile + run native base-vocabulary self-test (C11)
        run: >-
          cc -std=c11 -O2 -Wall -Wextra -pedantic
          large_language_models_vocabulary.c
          large_language_models_base_vocabulary.c
          tools/base_vocabulary_selftest.c
          -o /tmp/base_vocabulary_selftest
          && /tmp/base_vocabulary_selftest

      - name: Compile + run model-capacity self-test (C11)
        run: >-
          cc -std=c11 -O2 -Wall -Wextra -pedantic
          large_language_models_capacity.c
          tools/capacity_selftest.c
          -o /tmp/capacity_selftest
          && /tmp/capacity_selftest

      - name: Compile + run Code LLM profile self-test (C11)
        run: >-
          cc -std=c11 -O2 -Wall -Wextra -pedantic
          large_language_models_code.c
          tools/code_model_selftest.c
          -o /tmp/code_model_selftest
          && /tmp/code_model_selftest

      - name: Compile C++17 facades
        run: >-
          c++ -std=c++17 -O2 -Wall -Wextra -c large_language_models_vocabulary.cpp -o /tmp/v.o
          && c++ -std=c++17 -O2 -Wall -Wextra -c large_language_models_base_vocabulary.cpp -o /tmp/bv.o

      - name: Build + run reasoning demo (C11, capacity-aware)
        run: >-
          cc -std=c11 -O2 -Wall -Wextra -pedantic
          large_language_models.c
          large_language_models_reasoning.c
          large_language_models_capacity.c
          reasoning/reasoning_demo.c
          -o /tmp/reasoning_demo
          && /tmp/reasoning_demo

      - name: Compile reasoning + capacity C++17 facades
        run: >-
          c++ -std=c++17 -O2 -Wall -Wextra -c large_language_models_reasoning.cpp -o /tmp/r.o

      - name: Compile Code LLM C11 unit
        run: >-
          cc -std=c11 -O2 -Wall -Wextra -pedantic -c large_language_models_code.c -o /tmp/code.o

      - name: Build + run SLeeLa verifier self-test (C11)
        run: >-
          cc -std=c11 -O2 -Wall -Wextra -pedantic
          large_language_models.c large_language_models_reasoning.c
          sleela/sleela_code_verifier.c sleela/sleela_verifier_selftest.c
          -o /tmp/sleela_verifier_selftest
          && /tmp/sleela_verifier_selftest

      - name: Build + run SLeeLa Code LLM demo (C11)
        run: >-
          cc -std=c11 -O2 -Wall -Wextra -pedantic
          large_language_models.c large_language_models_reasoning.c
          sleela/sleela_code_verifier.c sleela/sleela_llm_demo.c
          -o /tmp/sleela_llm_demo
          && /tmp/sleela_llm_demo

      - name: Build + run parametry self-test (C11)
        run: >-
          cc -std=c11 -O2 -Wall -Wextra -pedantic
          parametry/parametry.c parametry/parametry_selftest.c
          -o /tmp/parametry_selftest
          && /tmp/parametry_selftest

      - name: Build + run parametry demo (LLM + neural net, known + local)
        run: >-
          cc -std=c11 -O2 -Wall -Wextra -pedantic
          parametry/parametry.c large_language_models_capacity.c
          ../neural-nets/neural_nets.c parametry/parametry_demo.c
          -o /tmp/parametry_demo -lm
          && /tmp/parametry_demo

      - name: Compile loader core + slnn sink warning-clean (C11)
        run: >-
          cc -std=c11 -O2 -Wall -Wextra -pedantic -c loader/example_loader.c -o /tmp/el.o
          && cc -std=c11 -O2 -Wall -Wextra -pedantic -c loader/example_loader_slnn.c -o /tmp/els.o

      - name: Build + run loader-handler demo (words/maths/objects -> real net)
        run: >-
          cc -std=c11 -O2 -Wall -Wextra -pedantic
          loader/example_loader.c loader/example_loader_slnn.c
          large_language_models_vocabulary.c large_language_models_base_vocabulary.c
          ../neural-nets/neural_nets.c loader/example_loader_demo.c
          -o /tmp/example_loader_demo -lm
          && /tmp/example_loader_demo

      - name: Build + run RRS demo (3-stage feed-forward, ternary 1/0/2)
        run: >-
          cc -std=c11 -O2 -Wall -Wextra -pedantic
          large_language_models.c large_language_models_reasoning.c
          ../rrs/rrs.c ../rrs/rrs_demo.c
          -o /tmp/rrs_demo
          && /tmp/rrs_demo

      - name: Compile RRS C++17 facade
        run: >-
          printf '#include "../rrs/rrs.hpp"\nint main(){return 0;}\n' > /tmp/rrs_cc.cpp
          && c++ -std=c++17 -O2 -Wall -Wextra -I. /tmp/rrs_cc.cpp ../rrs/rrs.c -o /tmp/rrs_cc

      - name: Build + run RRS signal monitor demo (1/0/2 signal analysis)
        run: >-
          cc -std=c11 -O2 -Wall -Wextra -pedantic
          ../rrs/rrs.c large_language_models.c large_language_models_reasoning.c
          ../rrs/rrs-signal-monitor/rrs_signal_monitor.c
          ../rrs/rrs-signal-monitor/rrs_signal_monitor_demo.c
          -o /tmp/rrs_signal_monitor_demo
          && /tmp/rrs_signal_monitor_demo
