name: Score BANKS4 Socialism Status

on:
  workflow_dispatch:
  push:
    branches:
      - master

permissions:
  contents: write

concurrency:
  group: score-banks4-socialism
  cancel-in-progress: true

jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Apply Socialism score
        run: python3 tools/banking/update_banks4_socialism.py

      - name: Validate 391 rows and four scores
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          text = Path('BANKS4.md').read_text(encoding='utf-8')
          rows = re.findall(r'^\| (\d{3}) \| (.*?) \| (.*?) \| (.*?) \| (.*?) \| (.*?) \| (.*?) \| (.*?) \| (.*?) \| (.*?) \| (.*?) \|$', text, re.M)
          assert len(rows) == 391, len(rows)
          assert [r[0] for r in rows] == [f'{i:03d}' for i in range(1, 392)]
          assert all(r[10] in {'YES','NO','CONVINCED','INDEED'} for r in rows)
          print('BANKS4 validation passed: 391 rows; four-value Socialism Status only.')
          PY

      - name: Commit updated BANKS4
        run: |
          git config user.name "SLeeLa Data Workflow"
          git config user.email "actions@users.noreply.github.com"
          git add BANKS4.md
          if git diff --cached --quiet; then
            echo "BANKS4 already scored."
          else
            git commit -m "Update BANKS4 Socialism Status scores"
            git push
          fi
