version: 1
description: SLeeLa explicit function-to-test verification map.
tests:
  - id: annotation.runtime
    sources: [test-suites/cpp/test_annotations.cpp]
    covers: [impl/annotation/Annotation.cpp, impl/annotation/AnnotationForwarder.cpp, impl/annotation/ForwardingAnnotation.cpp]
    behaviors: [normal, boundary, invalid]
  - id: annotation.frontend
    sources: [test-suites/cpp/test_frontend_annotations.cpp]
    covers: [impl/frontend/lexer.cpp, impl/frontend/parser.cpp, impl/frontend/semantic.cpp, impl/frontend/annotation_pipeline.cpp, impl/annotation/AnnotationRuntime.cpp]
    behaviors: [normal, invalid, integration]
  - id: http.bridge
    sources: [test-suites/c/test_http_bridge.c]
    covers: [http-servers/common/annotation_http_bridge.cpp]
    behaviors: [normal, invalid, boundary]
policy:
  required_behaviors: [normal, boundary, invalid]
  conditional_behaviors: [error, resource, concurrency, integration, regression]
  compile_only_is_not_behavioral_pass: true
