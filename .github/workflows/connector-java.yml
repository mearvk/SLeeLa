name: SLeeLa Java Connector CI

on:
  push:
    branches: [main, master]
    paths:
      - "connector/**"
      - ".github/workflows/connector-java.yml"
  pull_request:
    branches: [main, master]
    paths:
      - "connector/**"
      - ".github/workflows/connector-java.yml"
  workflow_dispatch:

concurrency:
  group: connector-java-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  java-connector:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 22
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "22"
      - name: Build connector
        run: make -C connector all
      - name: Run connector conformance and deployment checks
        run: make -C connector test
      - name: Package connector JAR
        run: make -C connector jar
      - name: Clean generated artifacts
        if: always()
        run: make -C connector clean
